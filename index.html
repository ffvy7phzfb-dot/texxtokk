    let themeIndex = parseInt(localStorage.getItem('trenerchek-theme-index')) || 0;
    const themeIcons = ['☀️', '🌙', '🤪'];

    function applyTheme(index) {
      document.body.classList.remove('dark-mode', 'crazy-mode');
      if (index === 1) document.body.classList.add('dark-mode');
      if (index === 2) document.body.classList.add('crazy-mode');
      document.querySelector('.theme-toggle').textContent = themeIcons[index];
      localStorage.setItem('trenerchek-theme-index', index);
      themeIndex = index;
    }

    function cycleTheme() {
      const next = (themeIndex + 1) % 3;
      applyTheme(next);
    }
    applyTheme(themeIndex);

    // ВСТАВКА ИЗ БУФЕРА / КОПИРОВАНИЕ
    // ============================================================

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        editor.value = text;
        checkText();
        showToast('📋 Текст вставлен из буфера обмена');
      } catch (err) {
        showToast('⚠️ Не удалось вставить текст. Разрешите доступ к буферу обмена.');
      }
    }

    function copyText() {
      const text = fixedTextEl.textContent;
      if (!text || !text.trim()) {
        showToast('⚠️ Нет текста для копирования');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        showToast('✅ Исправленный текст скопирован!');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✅ Исправленный текст скопирован!');
      });
    }

    function showToast(msg) {
      copyToast.textContent = msg;
      copyToast.classList.add('show');
      clearTimeout(copyToast._timeout);
      copyToast._timeout = setTimeout(() => copyToast.classList.remove('show'), 2500);
    }

    // ============================================================
    // БУКВА Ё (такая же, как в предыдущем коде)
    // ============================================================

    function fixYo() {
      const text = editor.value;
      if (!text.trim()) {
        showToast('⚠️ Нет текста для расстановки Ё');
        return;
      }
      try {
        let result = text;
        let changes = 0;

        const yoWords = {
          'пошел': 'пошёл',
          'пришел': 'пришёл',
          'ушел': 'ушёл',
          'зашел': 'зашёл',
          'перешел': 'перешёл',
          'отошел': 'отошёл',
          'дошел': 'дошёл',
          'нашел': 'нашёл',
          'обошел': 'обошёл',
          'прошел': 'прошёл',
          'еще': 'ещё',
          'все': 'всё',
          'всем': 'всём',
          'береза': 'берёза',
          'клен': 'клён',
          'мед': 'мёд',
          'лед': 'лёд',
          'пес': 'пёс',
          'темный': 'тёмный',
          'тяжелый': 'тяжёлый',
          'легкий': 'лёгкий',
          'теплый': 'тёплый',
          'желтый': 'жёлтый',
          'черный': 'чёрный',
          'зеленый': 'зелёный',
          'веселый': 'весёлый',
        };

        const keys = Object.keys(yoWords).sort((a, b) => b.length - a.length);
        for (const key of keys) {
          const val = yoWords[key];
          const regex = new RegExp('\\b' + key + '\\b', 'gi');
          result = result.replace(regex, (match) => {
            if (match === match.toUpperCase()) { changes++; return val.toUpperCase(); }
            if (match[0] === match[0].toUpperCase()) { changes++; return val[0].toUpperCase() + val.slice(1); }
            changes++;
            return val;
          });
        }

        if (typeof window.safeEyo !== 'undefined') {
          const before = result;
          result = window.safeEyo.restore(result);
          for (let i = 0; i < Math.min(before.length, result.length); i++) {
            if (before[i] !== result[i]) changes++;
          }
        }

        const lines = result.split('\n');
        const processed = lines.map(line => {
          const words = line.split(/\s+/);
          const newWords = words.map(w => {
            if (w.endsWith('ел') && w.length >= 4 && !yoWords[w.toLowerCase()]) {
              return w;
            }
            return w;
          });
          return newWords.join(' ');
        });
        result = processed.join('\n');

        let total = 0;
        for (let i = 0; i < Math.min(text.length, result.length); i++) {
          if (text[i] !== result[i]) total++;
        }

        if (total === 0) {
          showToast('📝 Буква Ё уже расставлена правильно');
        } else {
          editor.value = result;
          showToast('✅ Расставлено ' + total + ' букв Ё');
          checkText();
        }
      } catch (e) {
        console.error(e);
        showToast('⚠️ Ошибка при расстановке Ё');
      }
    }

    function findWaterWords(text) {
      const issues = [];
      const waterWords = [
        'очень', 'просто', 'немного', 'как бы', 'типа', 'вообще',
        'реально', 'буквально', 'абсолютно', 'совершенно', 'в принципе',
        'в общем', 'на самом деле', 'по сути', 'как-то', 'что-то',
        'где-то', 'когда-то', 'почти', 'чуть', 'слегка', 'вроде',
        'вообще-то', 'собственно', 'фактически', 'практически', 'примерно',
        'относительно', 'сравнительно', 'чрезвычайно', 'невероятно', 'потрясающе'
      ];

      for (const w of waterWords) {
        const regex = new RegExp('\\b' + w + '\\b', 'gi');
        let match;
        while ((match = regex.exec(text)) !== null) {
          issues.push({
            type: "💧 Вода (стоп-слово)",
            oldText: match[0],
            newText: match[0],
            position: match.index,
            suggestion: "можно убрать или заменить",
            fixType: 'water',
            suggestions: []
          });
        }
      }
      return issues;
    }

    // ============================================================
    // 🔗 СВЯЗКИ
    // ============================================================

    function findConnectors(text) {
      const issues = [];
      const connectors = ['и', 'но', 'а', 'зато', 'однако', 'при этом', 'кроме того', 'более того', 'в то же время',
        'тем не менее', 'вместе с тем', 'между тем', 'с другой стороны', 'во-первых', 'во-вторых', 'наконец'
      ];

      const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
      let pos = 0;
      for (const sent of sentences) {
        const trimmed = sent.trim();
        for (const conn of connectors) {
          if (trimmed.toLowerCase().startsWith(conn + ' ')) {
            const start = text.indexOf(trimmed, pos);
            issues.push({
              type: "🔗 Связка",
              oldText: conn,
              newText: conn,
              position: start,
              suggestion: "можно заменить или убрать",
              fixType: 'connector',
              suggestions: []
            });
            break;
          }
        }
        pos += sent.length;
      }
      return issues;
    }

    function findRepeatsWithSuggestions(text) {
      const issues = [];
      const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
      const allWords = text.match(/[А-Яа-яЁё]+/g) || [];

      // Собираем все позиции слов
      const wordPositions = [];
      let pos = 0;
      for (const w of allWords) {
        const idx = text.indexOf(w, pos);
        wordPositions.push({ word: w, index: idx });
        pos = idx + w.length;
      }

      // Повторы в одном предложении
      let globalPos = 0;
      for (const sent of sentences) {
        const words = sent.match(/[А-Яа-яЁё]+/g) || [];
        const freq = {};
        for (const w of words) {
          const lower = w.toLowerCase();
          freq[lower] = (freq[lower] || 0) + 1;
        }
        for (const w of words) {
          const lower = w.toLowerCase();
          if (freq[lower] >= 2) {
            const posIdx = text.indexOf(w, globalPos);
            if (posIdx !== -1) {
              const alreadyAdded = issues.some(i =>
                i.position === posIdx && i.oldText === w
              );
              if (!alreadyAdded) {
                const syns = synonyms[lower] || [];
                issues.push({
                  type: "🔁 Повтор слова в предложении",
                  oldText: w,
                  newText: syns.length > 0 ? syns[0] : w,
                  position: posIdx,
                  suggestion: syns.length > 0 ?
                    `можно заменить на: ${syns.slice(0, 3).join(', ')}` :
                    'попробуйте переформулировать',
                  fixType: 'repeat',
                  suggestions: syns.slice(0, 5)
                });
              }
            }
          }
        }
        globalPos += sent.length;
      }

      // Повторы в соседних предложениях (>3 раз во всём тексте)
      const freqAll = {};
      for (const w of allWords) {
        const lower = w.toLowerCase();
        freqAll[lower] = (freqAll[lower] || 0) + 1;
      }
      for (const w of allWords) {
        const lower = w.toLowerCase();
        if (freqAll[lower] > 3) {
          const posIdx = text.indexOf(w);
          if (posIdx !== -1) {
            const alreadyAdded = issues.some(i =>
              i.position === posIdx && i.oldText === w
            );
            if (!alreadyAdded) {
              const syns = synonyms[lower] || [];
              issues.push({
                type: "🔁 Частый повтор слова в тексте",
                oldText: w,
                newText: syns.length > 0 ? syns[0] : w,
                position: posIdx,
                suggestion: syns.length > 0 ?
                  `встречается ${freqAll[lower]} раз, можно заменить на: ${syns.slice(0, 3).join(', ')}` :
                  `встречается ${freqAll[lower]} раз, попробуйте переформулировать`,
                fixType: 'repeat',
                suggestions: syns.slice(0, 5)
              });
            }
          }
        }
      }

      return issues;
    }

    function findLongSentences(text) {
      const issues = [];
      const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
      let pos = 0;
      for (const sent of sentences) {
        const words = sent.match(/[А-Яа-яЁё]+/g) || [];
        if (words.length > 15) {
          issues.push({
            type: "Длинное предложение",
            oldText: sent.trim(),
            newText: sent.trim(),
            position: pos,
            suggestion: "разбейте на несколько предложений",
            fixType: 'long-sentence',
            suggestions: []
          });
        }
        pos += sent.length;
      }
      return issues;
    }

    function findLongParagraphs(text) {
      const issues = [];
      const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
      let pos = 0;
      for (const p of paragraphs) {
        const clean = p.replace(/\s/g, '');
        if (clean.length > 600) {
          const start = text.indexOf(p, pos);
          issues.push({
            type: "Длинный абзац",
            oldText: p.trim().slice(0, 80) + '...',
            newText: p.trim(),
            position: start,
            suggestion: "разбейте на несколько абзацев",
            fixType: 'long-paragraph',
            suggestions: []
          });
        }
        pos = text.indexOf(p, pos) + p.length;
      }
      return issues;
    }

    function checkAgreement(text) {
      const issues = [];
      const masc = ['он', 'мой', 'твой', 'наш', 'ваш', 'этот', 'тот', 'какой', 'такой', 'сам', 'весь'];
      const fem = ['она', 'моя', 'твоя', 'наша', 'ваша', 'эта', 'та', 'какая', 'такая', 'сама', 'вся'];
      const neut = ['оно', 'моё', 'твоё', 'наше', 'ваше', 'это', 'то', 'какое', 'такое', 'само', 'всё'];
      const plur = ['они', 'мои', 'твои', 'наши', 'ваши', 'эти', 'те', 'какие', 'такие', 'сами', 'все'];

      const words = text.match(/[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g) || [];
      const positions = [];
      let pos = 0;
      for (const w of words) {
        const idx = text.indexOf(w, pos);
        positions.push({ word: w, index: idx });
        pos = idx + w.length;
      }

      for (let i = 0; i < positions.length - 1; i++) {
        const cur = positions[i].word.toLowerCase();
        const next = positions[i + 1].word.toLowerCase();

        if (masc.includes(cur) && next.endsWith('ла') && !next.endsWith('лась')) {
          const base = next.slice(0, -2);
          issues.push({
            type: "Согласование (род)",
            oldText: positions[i].word + ' ' + positions[i + 1].word,
            newText: positions[i].word + ' ' + base + 'л',
            position: positions[i].index,
            suggestions: [positions[i].word + ' ' + base + 'л'],
            fixType: 'grammar'
          });
        }

        if (fem.includes(cur) && (next.endsWith('л') || next.endsWith('лся')) && !next.endsWith('ла') && !next.endsWith(
            'лась')) {
          const base = next.endsWith('лся') ? next.slice(0, -3) : next.slice(0, -1);
          issues.push({
            type: "Согласование (род)",
            oldText: positions[i].word + ' ' + positions[i + 1].word,
            newText: positions[i].word + ' ' + base + 'ла',
            position: positions[i].index,
            suggestions: [positions[i].word + ' ' + base + 'ла'],
            fixType: 'grammar'
          });
        }

        if (neut.includes(cur) && (next.endsWith('л') || next.endsWith('лся')) && !next.endsWith('ло') && !next.endsWith(
            'лось') && !next.endsWith('ла') && !next.endsWith('лась')) {
          const base = next.endsWith('лся') ? next.slice(0, -3) : next.slice(0, -1);
          issues.push({
            type: "Согласование (род)",
            oldText: positions[i].word + ' ' + positions[i + 1].word,
            newText: positions[i].word + ' ' + base + 'ло',
            position: positions[i].index,
            suggestions: [positions[i].word + ' ' + base + 'ло'],
            fixType: 'grammar'
          });
        }

        if (plur.includes(cur) && (next.endsWith('л') || next.endsWith('лся')) && !next.endsWith('ли') && !next.endsWith(
            'лись')) {
          const base = next.endsWith('лся') ? next.slice(0, -3) : next.slice(0, -1);
          issues.push({
            type: "Согласование (число)",
            oldText: positions[i].word + ' ' + positions[i + 1].word,
            newText: positions[i].word + ' ' + base + 'ли',
            position: positions[i].index,
            suggestions: [positions[i].word + ' ' + base + 'ли'],
            fixType: 'grammar'
          });
        }
      }
      return issues;
    }

    async function loadDictionary() {
      dictionaryStatus.textContent = "загрузка...";
      try {
        const resp = await fetch(DICTIONARY_FILE, { cache: "no-store" });
        if (!resp.ok) throw new Error("Словарь не найден");
        const data = await resp.text();
        const lines = data.split(/\r?\n/);
        let count = 0;
        for (const line of lines) {
          const l = line.trim().toLowerCase();
          if (!l) continue;
          const parts = l.split(/\t/);
          let word = parts[0] || l;
          word = word.trim();
          if (/^[а-яё-]+$/i.test(word) && word.length >= 1) {
            dictionary.add(word);
            count++;
          }
        }
        if (count < 100) throw new Error("Слишком мало слов: " + count);
        fallbackWords.forEach(w => dictionary.add(w.toLowerCase()));
        dictionaryLoaded = true;
        dictionaryStatus.textContent = count.toLocaleString("ru-RU");
        statusEl.textContent = "✅ Словарь загружен (" + count.toLocaleString() + " слов)";
        statusEl.className = "status ok";
        console.log('Словарь загружен:', count, 'слов');
      } catch (e) {
        console.error('Ошибка загрузки словаря:', e);
        fallbackWords.forEach(w => dictionary.add(w.toLowerCase()));
        dictionaryLoaded = false;
        dictionaryStatus.textContent = "резервный (" + dictionary.size + ")";
        statusEl.textContent = "⚠️ Словарь не загружен. Используется встроенный (" + dictionary.size + " слов).";
        statusEl.className = "status warning";
      }

      const issues = [];
      for (const item of bureaucracyWords) {
        const regex = new RegExp(item.word, 'gi');

          issues.push({

      const genitiveChain = /[А-Яа-яё]+\s+[А-Яа-яё]+\s+[А-Яа-яё]+(?:[А-Яа-яё]+)?/g;
      let match;
      while ((match = genitiveChain.exec(text)) !== null) {
        const words = match[0].split(/\s+/);
        let genCount = 0;
        for (const w of words) {
          if (w.endsWith('а') || w.endsWith('я') || w.endsWith('ов') || w.endsWith('ей')) genCount++;

    function getTextStats(text) {
      const words = text.match(/[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g) || [];
      const wordCount = words.length;
      const charCount = text.length;
      const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
      const sentenceCount = sentences.length || (text.trim() ? 1 : 0);
      const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
      const paragraphCount = paragraphs.length || (text.trim() ? 1 : 0);
      const totalLen = words.reduce((s, w) => s + w.length, 0);
      const avgWordLen = wordCount > 0 ? (totalLen / wordCount) : 0;
      return { wordCount, charCount, sentenceCount, paragraphCount, avgWordLen: Math.round(avgWordLen * 10) / 10 };
    }

      while ((match = punct.exec(text)) !== null) {
        issues.push({
          type: "Пробел перед знаком",
          oldText: match[0],
          newText: match[1],
          position: match.index,
          suggestions: [match[1]],
          fixType: 'punctuation'
        });

      if (dictionaryLoaded && dictionary.size > 0) {
        const wr = /[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g;
        while ((match = wr.exec(text)) !== null) {
          const original = match[0];
          const word = original.toLowerCase();
          if (word.length < 4) continue;
          if (dictionary.has(word)) continue;
          const exists = issues.some(x => x.position === match.index && x.oldText === original);
          if (exists) continue;
          const suggestion = findSuggestion(word);
          if (suggestion) {
            issues.push({
              type: "Возможная опечатка",
              oldText: original,
              newText: preserveCase(original, suggestion),
              position: match.index,
              suggestions: [preserveCase(original, suggestion)],
              fixType: 'spelling'
            });
          }
        }
      }
      return issues;
    }

    function findSuggestion(word) {
      let best = null,
        bestDist = Infinity;
      for (const cand of dictionary) {
        if (Math.abs(cand.length - word.length) > 2) continue;
        if (cand[0] !== word[0] && cand[0] !== word[0].toLowerCase()) continue;
        const d = levenshtein(word, cand);
        if (d < bestDist) { bestDist = d;
          best = cand; }
      }
      let threshold = 1;
      if (word.length >= 7) threshold = 2;
      if (word.length >= 11) threshold = 3;
      return bestDist <= threshold ? best : null;
    }

    function levenshtein(a, b) {
      if (a === b) return 0;
      if (a.length === 0) return b.length;
      if (b.length === 0) return a.length;
      let prev = new Array(b.length + 1);
      let cur = new Array(b.length + 1);
      for (let j = 0; j <= b.length; j++) prev[j] = j;
      for (let i = 1; i <= a.length; i++) {
        cur[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
        }
        [prev, cur] = [cur, prev];
      }
      return prev[b.length];
    }

    function preserveCase(orig, repl) {
      if (orig.length && orig[0] === orig[0].toUpperCase()) {
        return repl[0].toUpperCase() + repl.slice(1);
      }
      return repl;
    }

    function removeDuplicates(issues) {
      return issues.filter((item, idx, arr) =>
        idx === arr.findIndex(x => x.position === item.position && x.oldText === item.oldText)
      );
    }

    // ============================================================
    // API
    // ============================================================

    async function checkWithLanguageTool(text) {
      try {
        const resp = await fetch('https://api.languagetool.org/v2/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'text=' + encodeURIComponent(text) + '&language=ru&enabledOnly=false'
        });
        if (!resp.ok) throw new Error('LanguageTool недоступен');
        const data = await resp.json();
        return data.matches.map(e => ({
          type: "LanguageTool",
          oldText: text.substring(e.offset, e.offset + e.length),
          newText: e.replacements && e.replacements.length > 0 ? e.replacements[0].value : text.substring(e.offset, e
            .offset + e.length),
          position: e.offset,
          suggestions: e.replacements ? e.replacements.map(r => r.value) : [],
          fixType: 'grammar'
        }));
      } catch (e) {
        console.log('LanguageTool ошибка:', e);
        return [];
      }
    }

    async function checkWithYandex(text) {
      try {
        const resp = await fetch('https://speller.yandex.net/services/spellservice.json/checkText', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'text=' + encodeURIComponent(text) + '&lang=ru&options=1'
        });
        if (!resp.ok) throw new Error('Яндекс.Спеллер недоступен');
        const data = await resp.json();
        return data.map(e => ({
          type: "Яндекс.Спеллер",
          oldText: e.word,
          newText: e.s && e.s.length > 0 ? e.s[0] : e.word,
          position: e.pos,
          suggestions: e.s || [],
          fixType: 'spelling'
        }));
      } catch (e) {
        console.log('Яндекс ошибка:', e);
        return [];
      }
    }

    // ============================================================
    // ОСНОВНАЯ ПРОВЕРКА
    // ============================================================

    let currentIssues = [];
    let skippedIssues = [];
    let isChecking = false;

    function skipIssue(index) {
      const list = getCurrentIssuesList();
      if (index >= 0 && index < list.length) {
        skippedIssues.push(list[index]);
        renderResults();
        updateStats();
        updateHighlighting(editor.value);
        showToast('⏭️ Ошибка пропущена');
      }
    }

    function getCurrentIssuesList() {
      return currentIssues.filter(issue =>
        !skippedIssues.some(s =>
          s.position === issue.position && s.oldText === issue.oldText
        )
      );
    }

    function getFixedText(text) {
      let fixed = text;
      const list = getCurrentIssuesList();
      const fixes = [];
      for (const issue of list) {
        if (issue.suggestions && issue.suggestions.length > 0) {
          fixes.push({ position: issue.position, oldText: issue.oldText, newText: issue.newText });
        }
      }
      fixes.sort((a, b) => b.position - a.position);
      for (const f of fixes) {
        if (f.position + f.oldText.length <= fixed.length) {
          fixed = fixed.slice(0, f.position) + f.newText + fixed.slice(f.position + f.oldText.length);
        }
      }
      return fixed;
    }

    async function checkText() {
      const text = editor.value;
      if (!text.trim()) {
        currentIssues = [];
        skippedIssues = [];
        fixedTextEl.textContent = '';
        renderResults();
        updateStats();
        updateHighlighting(text);
        return;
      }
      if (isChecking) return;
      isChecking = true;
      statusEl.textContent = "⏳ Проверка...";
      statusEl.className = "status warning";
      document.querySelector('.primary').disabled = true;

      try {
        const [yandex, lt] = await Promise.all([
          checkWithYandex(text),
          checkWithLanguageTool(text)
        ]);
        const local = getLocalIssues(text);
        const agreement = checkAgreement(text);
        const bureau = findBureaucracy(text);
        const repeats = findRepeatsWithSuggestions(text);
        const water = findWaterWords(text);
        const connectors = findConnectors(text);
        const longSentences = findLongSentences(text);
        const longParagraphs = findLongParagraphs(text);

        let all = [...yandex, ...lt, ...local, ...agreement, ...bureau, ...repeats, ...water, ...connectors, ...
          longSentences, ...longParagraphs
        ];
        all.sort((a, b) => a.position - b.position);
        all = removeDuplicates(all);

        skippedIssues = [];
        currentIssues = all;

        const fixed = getFixedText(text);
        fixedTextEl.textContent = fixed;

        renderResults();
        updateStats();
        updateHighlighting(text);

        const total = getCurrentIssuesList().length;
        statusEl.textContent = "✅ Проверка завершена. Найдено " + total + " ошибок.";
        statusEl.className = total > 0 ? "status error" : "status ok";
      } catch (e) {
        console.error(e);
        statusEl.textContent = "⚠️ Ошибка проверки. Используем локальную.";
        statusEl.className = "status warning";
        const local = getLocalIssues(text);
        const agreement = checkAgreement(text);
        const bureau = findBureaucracy(text);
        const repeats = findRepeatsWithSuggestions(text);
        const water = findWaterWords(text);
        const connectors = findConnectors(text);
        const longSentences = findLongSentences(text);
        const longParagraphs = findLongParagraphs(text);
        currentIssues = [...local, ...agreement, ...bureau, ...repeats, ...water, ...connectors, ...longSentences, ...
          longParagraphs
        ];
        currentIssues.sort((a, b) => a.position - b.position);
        currentIssues = removeDuplicates(currentIssues);
        skippedIssues = [];
        const fixed = getFixedText(text);
        fixedTextEl.textContent = fixed;
        renderResults();
        updateStats();
        updateHighlighting(text);
      } finally {
        isChecking = false;
        document.querySelector('.primary').disabled = false;
      }
    }

    // ============================================================
    // ПОДСВЕТКА
    // ============================================================

    function updateHighlighting(text) {
      if (!text.trim()) { highlightOverlay.innerHTML = ''; return; }
      let html = '';
      const highlights = [];
      const list = getCurrentIssuesList();

      for (const err of list) {
        if (err.position + err.oldText.length <= text.length) {
          let cls = 'highlight-error';
          if (err.fixType === 'grammar') cls = 'highlight-grammar';
          else if (err.fixType === 'repeat') cls = 'highlight-repeat';
          else if (err.fixType === 'bureaucracy') cls = 'highlight-bureaucracy';
          else if (err.fixType === 'complex') cls = 'highlight-complex';
          else if (err.fixType === 'long-paragraph') cls = 'highlight-long-paragraph';
          else if (err.fixType === 'long-sentence') cls = 'highlight-long-sentence';
          else if (err.fixType === 'water') cls = 'highlight-water';
          else if (err.fixType === 'connector') cls = 'highlight-connector';
          highlights.push({ start: err.position, end: err.position + err.oldText.length, text: err.oldText,
            className: cls });
        }
      }

      highlights.sort((a, b) => a.start - b.start);
      let last = 0;
      for (const h of highlights) {
        if (h.start > last && h.start <= text.length) {
          html += escapeHTML(text.substring(last, Math.min(h.start, text.length)));
        }
        const end = Math.min(h.end, text.length);
        if (h.start < text.length) {
          html += `<span class="${h.className}">${escapeHTML(text.substring(h.start, end))}</span>`;
        }
        last = end;
      }
      if (last < text.length) html += escapeHTML(text.substring(last));
      highlightOverlay.innerHTML = html;
    }

    // ============================================================
    // СТАТИСТИКА
    // ============================================================

    function updateStats() {
      const text = editor.value;
      const stats = getTextStats(text);
      wordsEl.textContent = stats.wordCount;
      charsEl.textContent = stats.charCount;
      sentencesEl.textContent = stats.sentenceCount;
      paragraphsEl.textContent = stats.paragraphCount;
      avgWordLenEl.textContent = stats.avgWordLen;
      const total = getCurrentIssuesList().length;
      errorsEl.textContent = total;
      badgeEl.textContent = total;
      badgeEl.className = total === 0 ? "badge zero" : "badge";
    }

    // ============================================================
    // ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ
    // ============================================================

    function renderResults() {
      const list = getCurrentIssuesList();
      if (!list.length) {
        results.innerHTML =
          `<div class="empty"><div class="success">✓ Ошибок не найдено</div></div>`;
        return;
      }
      results.innerHTML = '';
      list.forEach((issue, idx) => {
        const item = document.createElement('div');
        item.className = 'issue';
        let suggHtml = '';
        if (issue.suggestions && issue.suggestions.length > 1) {
          suggHtml = `<div class="suggestions">${issue.suggestions.slice(0,5).map(s =>
            `<button onclick="applySuggestion(${idx}, '${escapeHTML(s)}')">${escapeHTML(s)}</button>`
          ).join('')}</div>`;
        }
        let extra = '';
        if (issue.suggestion && (issue.fixType === 'bureaucracy' || issue.fixType === 'water' || issue.fixType ===
            'connector')) {
          extra =
            `<div style="margin-top:6px;font-size:13px;color:#ff8c00;">💡 ${escapeHTML(issue.suggestion)}</div>`;
        }
        if (issue.fixType === 'complex' || issue.fixType === 'long-sentence' || issue.fixType === 'long-paragraph') {
          extra =
            `<div style="margin-top:6px;font-size:13px;color:#ff6f91;">💡 ${escapeHTML(issue.suggestion || 'рекомендуется упростить')}</div>`;
        }
        const hasFix = issue.suggestions && issue.suggestions.length > 0;
        item.innerHTML = `
          <div class="issue-title">${escapeHTML(issue.type)} <span class="tag">#${idx+1}</span></div>
          <div class="issue-text"><span class="wrong">${escapeHTML(showSpaces(issue.oldText))}</span> ${hasFix ? `→ <span class="correct">${escapeHTML(showSpaces(issue.newText))}</span>` : ''}</div>
          ${extra} ${suggHtml}
          <div class="issue-actions">
            ${hasFix ? `<button class="fix" onclick="applyIssue(${idx})">✅ Исправить</button>` : ''}
            <button class="skip" onclick="skipIssue(${idx})">⏭️ Пропустить</button>
          </div>
        `;
        results.appendChild(item);
      });
    }

    function applyIssue(index) {
      const list = getCurrentIssuesList();
      const issue = list[index];
      if (!issue || !issue.suggestions || !issue.suggestions.length) return;
      const text = editor.value;
      editor.value = text.slice(0, issue.position) + issue.newText + text.slice(issue.position + issue.oldText.length);
      const idx = currentIssues.findIndex(i => i.position === issue.position && i.oldText === issue.oldText);
      if (idx !== -1) currentIssues.splice(idx, 1);
      checkText();
    }

    function applySuggestion(index, suggestion) {
      const list = getCurrentIssuesList();
      const issue = list[index];
      if (!issue) return;
      const text = editor.value;
      editor.value = text.slice(0, issue.position) + suggestion + text.slice(issue.position + issue.oldText.length);
      checkText();
    }

    function fixAll() {
      checkText();
      const list = getCurrentIssuesList();
      const fixable = list.filter(i => i.suggestions && i.suggestions.length > 0);
      if (!fixable.length) return;
      const sorted = [...fixable].sort((a, b) => b.position - a.position);
      let text = editor.value;
      for (const issue of sorted) {
        if (issue.position + issue.oldText.length <= text.length) {
          const cur = text.substring(issue.position, issue.position + issue.oldText.length);
          if (cur === issue.oldText) {
            text = text.slice(0, issue.position) + issue.newText + text.slice(issue.position + issue.oldText.length);
          }
        }
      }
      if (text !== editor.value) {
        editor.value = text;
        currentIssues = [];
        skippedIssues = [];
        checkText();
      }
    }

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ
    // ============================================================

    function showSpaces(v) { return v.replace(/ /g, "␠").replace(/\t/g, "⇥"); }

    function escapeHTML(v) {
      return v.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g,
        "&#039;");
    }

    function clearText() {
      editor.value = "";
      fixedTextEl.textContent = "";
      currentIssues = [];
      skippedIssues = [];
      results.innerHTML = `<div class="empty">Введите текст и нажмите «Проверить».</div>`;
      updateStats();
      updateHighlighting('');
      statusEl.textContent = "Готово к проверке.";
      statusEl.className = "status";
    }

    function demo() {
      editor.value =
        `Привет! Проверь мой текст.\n\nОн пошла в магазин. Она пошёл домой. Он купил хлеб. Он очень доволен.\n\nВ целях обеспечения качества просим вас предоставить информацию. Это очень длинное предложение, которое состоит из более чем пятнадцати слов, и его нужно обязательно разбить на несколько частей для улучшения читаемости.\n\nСпасибо!`;
      checkText();
    }

    // ============================================================
    // АВТОПРОВЕРКА
    // ============================================================

    let autoTimeout;
    editor.addEventListener('input', function() {
      clearTimeout(autoTimeout);
      autoTimeout = setTimeout(() => {
        if (this.value.trim().length > 10) checkText();
        else { updateStats();
          updateHighlighting(this.value); }
      }, 1500);
    });

    editor.addEventListener('scroll', function() {
      highlightOverlay.scrollTop = this.scrollTop;
      highlightOverlay.scrollLeft = this.scrollLeft;
    });

    // ============================================================
    // ЗАПУСК
    // ============================================================

    updateStats();
    loadDictionary();
  </script>

</body>
</html>
