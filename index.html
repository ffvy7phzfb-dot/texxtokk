<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ТекстОК — проверка русского текста</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#20222b;
  background:
    radial-gradient(circle at 0 0,#e8e5ff,transparent 35%),
    radial-gradient(circle at 100% 100%,#ddf7ef,transparent 35%),
    #f5f6fa;
}

.container{
  width:min(1100px,calc(100% - 30px));
  margin:auto;
  padding:35px 0 60px;
}

header{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  font-size:42px;
  font-weight:850;
  letter-spacing:-1.5px;
}

.logo span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  margin-right:8px;
  border-radius:15px;
  background:#655cf5;
  color:white;
}

.subtitle{
  color:#777b86;
  margin-top:10px;
}

.card{
  background:rgba(255,255,255,.94);
  border:1px solid #e7e7ec;
  border-radius:24px;
  padding:22px;
  margin-top:20px;
  box-shadow:0 18px 50px #22223810;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  transform:translateY(-1px);
}

button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

.primary{
  background:#655cf5;
  color:#fff;
}

.secondary{
  background:#eceaff;
  color:#5148d8;
}

.light{
  background:#f0f1f5;
  color:#555a68;
}

textarea{
  width:100%;
  min-height:390px;
  resize:vertical;
  border:1px solid #dedfe5;
  border-radius:18px;
  padding:20px;
  outline:none;
  background:#fbfbfd;
  color:#20222b;
  font:18px/1.65 inherit;
}

textarea:focus{
  border-color:#655cf5;
  box-shadow:0 0 0 4px #655cf515;
  background:#fff;
}

textarea:disabled{
  background:#f0f0f3;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:15px;
}

.stat{
  background:#f1f2f6;
  padding:8px 12px;
  border-radius:10px;
  color:#686d78;
  font-size:14px;
}

.status{
  margin-top:12px;
  font-size:14px;
  color:#777b86;
}

.status.ok{
  color:#15966d;
}

.status.error{
  color:#d73d3d;
}

.status.warning{
  color:#e6a700;
}

.results-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  min-width:32px;
  height:32px;
  padding:0 9px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#fff0f0;
  color:#d73d3d;
  font-weight:800;
}

.badge.zero{
  background:#e8f5e9;
  color:#15966d;
}

.empty{
  padding:35px;
  text-align:center;
  color:#777b86;
}

.success{
  color:#15966d;
  font-weight:800;
}

.issue{
  padding:15px;
  border:1px solid #ececf1;
  border-radius:15px;
  margin-top:10px;
  background:#fafafe;
}

.issue-title{
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}

.issue-title .tag{
  font-size:11px;
  font-weight:600;
  background:#655cf515;
  color:#655cf5;
  padding:2px 10px;
  border-radius:20px;
}

.issue-text{
  margin-top:8px;
  color:#646874;
}

.wrong{
  color:#d63e3e;
  text-decoration:underline wavy #d63e3e;
  font-weight:750;
}

.correct{
  color:#15966d;
  font-weight:750;
}

.fix{
  margin-top:10px;
  padding:8px 12px;
  background:#f0efff;
  color:#5148d8;
  font-size:14px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.fix:hover{
  background:#e0defa;
}

.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.suggestions button{
  padding:4px 12px;
  border:1px solid #dedfe5;
  border-radius:8px;
  background:white;
  font-size:14px;
  cursor:pointer;
}

.suggestions button:hover{
  border-color:#655cf5;
  background:#f5f3ff;
}

.loading-spinner{
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid #e0e0e0;
  border-top:2px solid #655cf5;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin-right:8px;
  vertical-align:middle;
}

@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

@media(max-width:600px){
  .container{
    width:calc(100% - 18px);
    padding-top:20px;
  }

  .logo{
    font-size:34px;
  }

  .card{
    padding:15px;
    border-radius:18px;
  }

  textarea{
    min-height:320px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>

  <div class="logo">
    <span>✓</span>ТекстОК
  </div>

  <div class="subtitle">
    Проверка русского текста с Яндекс.Спеллер
  </div>

</header>


<section class="card">

  <div class="toolbar">

    <button class="primary" onclick="checkText()">
      🔎 Проверить
    </button>

    <button class="secondary" onclick="fixAll()">
      ✨ Исправить всё
    </button>

    <button class="light" onclick="demo()">
      Демо
    </button>

    <button class="light" onclick="clearText()">
      Очистить
    </button>

  </div>


  <textarea
    id="editor"
    placeholder="Вставьте сюда русский текст..."
  ></textarea>


  <div class="stats">

    <div class="stat">
      Слов: <b id="words">0</b>
    </div>

    <div class="stat">
      Символов: <b id="chars">0</b>
    </div>

    <div class="stat">
      Ошибок: <b id="errors">0</b>
    </div>

    <div class="stat">
      Словарь: <b id="dictionaryStatus">загрузка...</b>
    </div>

  </div>

  <div id="status" class="status">
    Загружаем словарь...
  </div>

</section>


<section class="card">

  <div class="results-head">

    <h2>Результаты</h2>

    <div id="badge" class="badge">0</div>

  </div>


  <div id="results">

    <div class="empty">
      Введите текст и нажмите «Проверить».
    </div>

  </div>

</section>

</div>


<script>

/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

// ССЫЛКА НА БОЛЬШОЙ СЛОВАРЬ ИЗ 100 000 СЛОВ
const DICTIONARY_FILE = "https://raw.githubusercontent.com/ffvy7phzfb-dot/texxtokk/main/100_000_russian_wordlist.txt";

const editor = document.getElementById("editor");
const results = document.getElementById("results");
const statusEl = document.getElementById("status");

const wordsEl = document.getElementById("words");
const charsEl = document.getElementById("chars");
const errorsEl = document.getElementById("errors");
const badgeEl = document.getElementById("badge");
const dictionaryStatus =
  document.getElementById("dictionaryStatus");


/* =========================================================
   СЛОВАРЬ
   ========================================================= */

let dictionary = new Set();

let dictionaryLoaded = false;


/* =========================================================
   НЕБОЛЬШОЙ РЕЗЕРВНЫЙ СЛОВАРЬ
   ========================================================= */

const fallbackWords = `
я ты он она оно мы вы они
и а но или да нет
это тот эта это эти
как что где когда почему
кто какой которая который которые
быть есть был была были будет
делать сделать сделал сделали
сказать говорить говорил
идти пойти ходить
знать понимать думать
хотеть мочь должен
можно нельзя нужно
человек люди время день год
сегодня завтра вчера
текст слово предложение
русский язык программа компьютер
сайт работа помощь
привет спасибо пожалуйста
хороший хороший хорошо
проверка ошибка ошибка
`.trim().split(/\s+/);


/* =========================================================
   ЗАГРУЗКА СЛОВАРЯ
   ========================================================= */

async function loadDictionary(){

  dictionaryStatus.textContent = "загрузка";

  try{

    const response =
      await fetch(DICTIONARY_FILE, {
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error("Словарь не найден");
    }

    const data = await response.text();

    const lines =
      data.split(/\r?\n/);

    for(let line of lines){

      line = line.trim().toLowerCase();

      if(!line) continue;

      const parts = line.split(/\t/);
      let word = parts[0];

      if(!word){
        word = line;
      }

      word = word.trim();

      if(
        /^[а-яё-]+$/i.test(word) &&
        word.length >= 1
      ){
        dictionary.add(word);
      }
    }

    fallbackWords.forEach(
      word => dictionary.add(word.toLowerCase())
    );

    dictionaryLoaded = true;

    dictionaryStatus.textContent =
      dictionary.size.toLocaleString("ru-RU");

    statusEl.textContent =
      "Словарь загружен. Можно проверять текст.";

    statusEl.className = "status ok";

  }catch(error){

    fallbackWords.forEach(
      word => dictionary.add(word.toLowerCase())
    );

    dictionaryLoaded = false;

    dictionaryStatus.textContent =
      "резервный (" + dictionary.size + ")";

    statusEl.textContent =
      "Словарь не найден. Используется небольшой встроенный словарь.";

    statusEl.className = "status error";
  }
}


/* =========================================================
   ОСНОВНАЯ ПРОВЕРКА С YANDEX SPELLER
   ========================================================= */

let currentIssues = [];
let isChecking = false;

async function checkText(){

  const text = editor.value;

  if(!text.trim()){
    currentIssues = [];
    renderResults();
    updateStats();
    return;
  }

  if(isChecking) return;

  isChecking = true;
  statusEl.textContent = "⏳ Проверка с Яндекс.Спеллер...";
  statusEl.className = "status warning";
  document.querySelector('.primary').disabled = true;

  try{

    // 1. Проверка через Яндекс.Спеллер
    const response = await fetch('https://speller.yandex.net/services/spellservice.json/checkText', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: 'text=' + encodeURIComponent(text) + '&lang=ru&options=1'
    });

    if(!response.ok){
      throw new Error('Яндекс.Спеллер недоступен');
    }

    const data = await response.json();

    // 2. Преобразуем ошибки в наш формат
    const yandexIssues = data.map(error => ({
      type: "Яндекс.Спеллер",
      oldText: error.word,
      newText: error.s && error.s.length > 0 ? error.s[0] : error.word,
      position: error.pos,
      suggestions: error.s || []
    }));

    // 3. Добавляем локальные проверки (пробелы, повторы)
    const localIssues = getLocalIssues(text);

    // 4. Объединяем и сортируем
    currentIssues = [...yandexIssues, ...localIssues];
    currentIssues.sort((a,b) => a.position - b.position);

    // 5. Удаляем дубликаты
    currentIssues = removeDuplicates(currentIssues);

    renderResults();
    updateStats();

    statusEl.textContent = "✅ Проверка завершена. Найдено " + currentIssues.length + " ошибок.";
    statusEl.className = currentIssues.length > 0 ? "status error" : "status ok";

  }catch(error){

    console.log('Ошибка Яндекс.Спеллер:', error);
    statusEl.textContent = "⚠️ Яндекс.Спеллер недоступен. Используем локальную проверку.";
    statusEl.className = "status warning";

    // Если Яндекс не отвечает — используем локальную проверку
    currentIssues = getLocalIssues(text);
    renderResults();
    updateStats();

  }finally{
    isChecking = false;
    document.querySelector('.primary').disabled = false;
  }
}


/* =========================================================
   ЛОКАЛЬНАЯ ПРОВЕРКА (ПРОБЕЛЫ, ПОВТОРЫ, СЛОВАРЬ)
   ========================================================= */

function getLocalIssues(text){

  const issues = [];

  // 1. Лишние пробелы
  let match;
  const spaces = / {2,}/g;
  while((match = spaces.exec(text)) !== null){
    issues.push({
      type: "Лишние пробелы",
      oldText: match[0],
      newText: " ",
      position: match.index,
      suggestions: [" "]
    });
  }

  // 2. Табуляция
  const tabs = /\t+/g;
  while((match = tabs.exec(text)) !== null){
    issues.push({
      type: "Табуляция",
      oldText: match[0],
      newText: " ",
      position: match.index,
      suggestions: [" "]
    });
  }

  // 3. Пробел перед пунктуацией
  const punctuation = / +([,.!?;:])/g;
  while((match = punctuation.exec(text)) !== null){
    issues.push({
      type: "Пробел перед знаком",
      oldText: match[0],
      newText: match[1],
      position: match.index,
      suggestions: [match[1]]
    });
  }

  // 4. Повторы слов
  const repeated = /\b([А-Яа-яЁё]+)\s+\1\b/giu;
  while((match = repeated.exec(text)) !== null){
    issues.push({
      type: "Повтор слова",
      oldText: match[0],
      newText: match[1],
      position: match.index,
      suggestions: [match[1]]
    });
  }

  // 5. Проверка по словарю (если словарь загружен)
  if(dictionaryLoaded && dictionary.size > 0){
    const wordsRegex = /[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g;
    while((match = wordsRegex.exec(text)) !== null){
      const original = match[0];
      const word = original.toLowerCase();

      if(word.length < 4) continue;
      if(dictionary.has(word)) continue;

      // Проверяем, нет ли уже такой ошибки
      const exists = issues.some(x => x.position === match.index && x.oldText === original);
      if(exists) continue;

      const suggestion = findSuggestion(word);
      if(suggestion){
        issues.push({
          type: "Возможная опечатка",
          oldText: original,
          newText: preserveCase(original, suggestion),
          position: match.index,
          suggestions: [preserveCase(original, suggestion)]
        });
      }
    }
  }

  return issues;
}


/* =========================================================
   УДАЛЕНИЕ ДУБЛИКАТОВ
   ========================================================= */

function removeDuplicates(issues){
  return issues.filter((item,index,array) =>
    index === array.findIndex(x =>
      x.position === item.position &&
      x.oldText === item.oldText
    )
  );
}


/* =========================================================
   ПОИСК БЛИЖАЙШЕГО СЛОВА
   ========================================================= */

function findSuggestion(word){

  let best = null;
  let bestDistance = Infinity;

  for(const candidate of dictionary){

    if(Math.abs(candidate.length - word.length) > 2) continue;

    if(candidate[0] !== word[0] && candidate[0] !== word[0].toLowerCase()) continue;

    const distance = levenshtein(word, candidate);

    if(distance < bestDistance){
      bestDistance = distance;
      best = candidate;
    }
  }

  let threshold = 1;
  if(word.length >= 7) threshold = 2;
  if(word.length >= 11) threshold = 3;

  if(bestDistance <= threshold) return best;
  return null;
}


/* =========================================================
   LEVENSHTEIN
   ========================================================= */

function levenshtein(a,b){
  if(a === b) return 0;
  if(a.length === 0) return b.length;
  if(b.length === 0) return a.length;

  let previous = new Array(b.length + 1);
  let current = new Array(b.length + 1);

  for(let j=0;j<=b.length;j++) previous[j] = j;

  for(let i=1;i<=a.length;i++){
    current[0] = i;
    for(let j=1;j<=b.length;j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      current[j] = Math.min(
        current[j-1] + 1,
        previous[j] + 1,
        previous[j-1] + cost
      );
    }
    [previous,current] = [current,previous];
  }

  return previous[b.length];
}


/* =========================================================
   РЕГИСТР
   ========================================================= */

function preserveCase(original, replacement){
  if(original.length && original[0] === original[0].toUpperCase()){
    return replacement[0].toUpperCase() + replacement.slice(1);
  }
  return replacement;
}


/* =========================================================
   СТАТИСТИКА
   ========================================================= */

function updateStats(){

  const text = editor.value;

  const words = text.match(/[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g) || [];

  wordsEl.textContent = words.length;
  charsEl.textContent = text.length;
  errorsEl.textContent = currentIssues.length;
  badgeEl.textContent = currentIssues.length;

  if(currentIssues.length === 0){
    badgeEl.className = "badge zero";
  }else{
    badgeEl.className = "badge";
  }
}


/* =========================================================
   ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ
   ========================================================= */

function renderResults(){

  if(!currentIssues.length){

    results.innerHTML = `
      <div class="empty">
        <div class="success">✓ Ошибок не найдено</div>
        <div style="margin-top:8px">Текст выглядит хорошо.</div>
      </div>
    `;

    return;
  }

  results.innerHTML = "";

  currentIssues.forEach((issue, index) => {

    const item = document.createElement("div");
    item.className = "issue";

    let suggestionsHtml = "";
    if(issue.suggestions && issue.suggestions.length > 1){
      suggestionsHtml = `
        <div class="suggestions">
          ${issue.suggestions.slice(0,5).map(s =>
            `<button onclick="applySuggestion(${index}, '${escapeHTML(s)}')">${escapeHTML(s)}</button>`
          ).join('')}
        </div>
      `;
    }

    item.innerHTML = `
      <div class="issue-title">
        ${escapeHTML(issue.type)}
        <span class="tag">ошибка #${index + 1}</span>
      </div>
      <div class="issue-text">
        <span class="wrong">${escapeHTML(showSpaces(issue.oldText))}</span>
        →
        <span class="correct">${escapeHTML(showSpaces(issue.newText))}</span>
      </div>
      ${suggestionsHtml}
      <button class="fix" onclick="applyIssue(${index})">Исправить</button>
    `;

    results.appendChild(item);
  });
}


/* =========================================================
   ПРИМЕНИТЬ ИСПРАВЛЕНИЕ
   ========================================================= */

function applyIssue(index){

  const issue = currentIssues[index];
  if(!issue) return;

  const text = editor.value;

  editor.value =
    text.slice(0, issue.position) +
    issue.newText +
    text.slice(issue.position + issue.oldText.length);

  checkText();
}


function applySuggestion(index, suggestion){

  const issue = currentIssues[index];
  if(!issue) return;

  const text = editor.value;

  editor.value =
    text.slice(0, issue.position) +
    suggestion +
    text.slice(issue.position + issue.oldText.length);

  checkText();
}


/* =========================================================
   ИСПРАВИТЬ ВСЁ
   ========================================================= */

function fixAll(){

  checkText();

  if(!currentIssues.length) return;

  const sorted = [...currentIssues].sort((a,b) => b.position - a.position);
  let text = editor.value;

  for(const issue of sorted){
    text =
      text.slice(0, issue.position) +
      issue.newText +
      text.slice(issue.position + issue.oldText.length);
  }

  editor.value = text;
  checkText();
}


/* =========================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
   ========================================================= */

function showSpaces(value){
  return value.replace(/ /g, "␠").replace(/\t/g, "⇥");
}

function escapeHTML(value){
  return value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   ОЧИСТИТЬ
   ========================================================= */

function clearText(){

  editor.value = "";
  currentIssues = [];

  results.innerHTML = `
    <div class="empty">Введите текст и нажмите «Проверить».</div>
  `;

  updateStats();

  statusEl.textContent = "Готово к проверке.";
  statusEl.className = "status";
}


/* =========================================================
   ДЕМО
   ========================================================= */

function demo(){

  editor.value =
`Привет! Это мой тестовый текст.

Сегодня я хотел сделать хороший сайт, но пока не знаю, как будет он работать.

Спасибо большое за помощь!`;

  checkText();
}


/* =========================================================
   ЗАПУСК
   ========================================================= */

updateStats();
loadDictionary();

</script>

</body>
</html>
