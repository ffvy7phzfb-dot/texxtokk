<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ТекстОК — проверка русского текста</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#20222b;
  background:
    radial-gradient(circle at 0 0,#e8e5ff,transparent 35%),
    radial-gradient(circle at 100% 100%,#ddf7ef,transparent 35%),
    #f5f6fa;
}

.container{
  width:min(1100px,calc(100% - 30px));
  margin:auto;
  padding:35px 0 60px;
}

header{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  font-size:42px;
  font-weight:850;
  letter-spacing:-1.5px;
}

.logo span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  margin-right:8px;
  border-radius:15px;
  background:#655cf5;
  color:white;
}

.subtitle{
  color:#777b86;
  margin-top:10px;
}

.card{
  background:rgba(255,255,255,.94);
  border:1px solid #e7e7ec;
  border-radius:24px;
  padding:22px;
  margin-top:20px;
  box-shadow:0 18px 50px #22223810;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
  transition:all 0.15s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 12px #00000020;
}

button:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none !important;
}

.primary{
  background:#655cf5;
  color:#fff;
}

.secondary{
  background:#eceaff;
  color:#5148d8;
}

.light{
  background:#f0f1f5;
  color:#555a68;
}

.text-wrapper{
  position:relative;
  border-radius:18px;
  overflow:hidden;
}

textarea{
  width:100%;
  min-height:390px;
  resize:vertical;
  border:1px solid #dedfe5;
  border-radius:18px;
  padding:20px;
  outline:none;
  background:#fbfbfd;
  color:#20222b;
  font:18px/1.65 inherit;
  position:relative;
  z-index:2;
  background:transparent;
}

textarea:focus{
  border-color:#655cf5;
  box-shadow:0 0 0 4px #655cf515;
}

.highlight-overlay{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  pointer-events:none;
  z-index:1;
  padding:20px;
  font:18px/1.65 inherit;
  color:transparent;
  white-space:pre-wrap;
  word-wrap:break-word;
  overflow:hidden;
  border-radius:18px;
}

.highlight-error{
  background:#ff000030;
  border-bottom:2px wavy #ff0000;
  border-radius:2px;
}

.highlight-repeat{
  background:#1a73e830;
  border-bottom:2px solid #1a73e8;
  border-radius:2px;
}

.highlight-long-paragraph{
  background:#ff8c0030;
  border-left:4px solid #ff8c00;
  border-radius:2px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:8px;
  margin-top:15px;
}

.stat{
  background:#f1f2f6;
  padding:10px 14px;
  border-radius:10px;
  color:#686d78;
  font-size:13px;
  text-align:center;
}

.stat b{
  color:#20222b;
  font-size:15px;
}

.status{
  margin-top:12px;
  font-size:14px;
  color:#777b86;
  padding:8px 14px;
  border-radius:10px;
  background:#f8f8fb;
}

.status.ok{
  background:#e8f5e9;
  color:#15966d;
}

.status.error{
  background:#ffebee;
  color:#d73d3d;
}

.status.warning{
  background:#fff8e1;
  color:#e6a700;
}

.results-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  min-width:32px;
  height:32px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#fff0f0;
  color:#d73d3d;
  font-weight:800;
  font-size:15px;
}

.badge.zero{
  background:#e8f5e9;

}

.empty{
  padding:35px;
  text-align:center;
  color:#777b86;
}

.success{
  color:#15966d;
  font-weight:800;
}

.issue{
  padding:15px;
  border:1px solid #ececf1;
  border-radius:15px;
  margin-top:10px;
  background:#fafafe;
  transition:all 0.2s;
}

.issue:hover{
  border-color:#655cf5;
  box-shadow:0 2px 12px #655cf515;
}

.issue-title{
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}

.issue-title .tag{
  font-size:11px;
  font-weight:600;
  background:#655cf515;
  color:#655cf5;
  padding:2px 10px;
  border-radius:20px;
}

.issue-text{
  margin-top:8px;
  color:#646874;
}

.wrong{
  color:#d63e3e;
  text-decoration:underline wavy #d63e3e;
  font-weight:750;
}

.correct{
  color:#15966d;
  font-weight:750;
}

.fix{
  margin-top:10px;
  padding:8px 16px;
  background:#f0efff;
  color:#5148d8;
  font-size:14px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  transition:all 0.15s;
}

.fix:hover{
  background:#e0defa;
}

.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.suggestions button{
  padding:4px 12px;
  border:1px solid #dedfe5;
  border-radius:8px;
  background:white;
  font-size:14px;
  cursor:pointer;
  transition:all 0.15s;
}

.suggestions button:hover{
  border-color:#655cf5;
  background:#f5f3ff;

  box-shadow:0 2px 8px #655cf515;

@media(max-width:600px){
  .container{
    width:calc(100% - 18px);
    padding-top:20px;
  }

  .logo{
    font-size:34px;
  }

  .card{
    padding:15px;
    border-radius:18px;
  }

  textarea{
    min-height:320px;
    font-size:16px;
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">
    <span>✓</span>ТекстОК
  </div>
  <div class="subtitle">
    Проверка русского текста с Яндекс.Спеллер
  </div>
</header>


<section class="card">

  <div class="toolbar">
    <button class="primary" onclick="checkText()">🔎 Проверить</button>
    <button class="secondary" onclick="fixAll()">✨ Исправить всё</button>
    <button class="light" onclick="demo()">Демо</button>
    <button class="light" onclick="clearText()">Очистить</button>
  </div>

  <div class="text-wrapper">
    <textarea id="editor" placeholder="Вставьте сюда русский текст..."></textarea>
    <div id="highlightOverlay" class="highlight-overlay"></div>
  </div>

  <div class="stats-grid">
    <div class="stat">Слов: <b id="words">0</b></div>
    <div class="stat">Символов: <b id="chars">0</b></div>
    <div class="stat">Предложений: <b id="sentences">0</b></div>
    <div class="stat">Абзацев: <b id="paragraphs">0</b></div>
    <div class="stat">Ср. длина слова: <b id="avgWordLen">0</b></div>
    <div class="stat">Ошибок: <b id="errors">0</b></div>
    <div class="stat">Словарь: <b id="dictionaryStatus">загрузка...</b></div>
  </div>

  <div id="status" class="status">Загружаем словарь...</div>

</section>


<section class="card">

  <div class="results-head">
    <h2>Результаты</h2>
    <div id="badge" class="badge">0</div>
  </div>

  <div id="results">
    <div class="empty">Введите текст и нажмите «Проверить».</div>
  </div>

</section>

</div>


<script>

/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

const DICTIONARY_FILE = "https://raw.githubusercontent.com/ffvy7phzfb-dot/texxtokk/main/100_000_russian_wordlist.txt";

const editor = document.getElementById("editor");
const results = document.getElementById("results");
const statusEl = document.getElementById("status");
const highlightOverlay = document.getElementById("highlightOverlay");

const wordsEl = document.getElementById("words");
const charsEl = document.getElementById("chars");
const sentencesEl = document.getElementById("sentences");
const paragraphsEl = document.getElementById("paragraphs");
const avgWordLenEl = document.getElementById("avgWordLen");
const errorsEl = document.getElementById("errors");
const badgeEl = document.getElementById("badge");
const dictionaryStatus = document.getElementById("dictionaryStatus");


/* =========================================================
   СЛОВАРЬ
   ========================================================= */

let dictionary = new Set();
let dictionaryLoaded = false;


const fallbackWords = `
я ты он она оно мы вы они
и а но или да нет
это тот эта это эти
как что где когда почему
кто какой которая который которые
быть есть был была были будет
делать сделать сделал сделали
сказать говорить говорил
идти пойти ходить
знать понимать думать
хотеть мочь должен
можно нельзя нужно
человек люди время день год
сегодня завтра вчера
текст слово предложение
русский язык программа компьютер
сайт работа помощь
привет спасибо пожалуйста
хороший хороший хорошо
проверка ошибка ошибка
`.trim().split(/\s+/);


/* =========================================================
   ЗАГРУЗКА СЛОВАРЯ
   ========================================================= */

async function loadDictionary(){

  dictionaryStatus.textContent = "загрузка...";

  try{

    const response = await fetch(DICTIONARY_FILE, { cache:"no-store" });

    if(!response.ok) throw new Error("Словарь не найден");

    const data = await response.text();
    const lines = data.split(/\r?\n/);

    let count = 0;
    for(let line of lines){

      line = line.trim().toLowerCase();
      if(!line) continue;

      const parts = line.split(/\t/);
      let word = parts[0] || line;
      word = word.trim();

      if(/^[а-яё-]+$/i.test(word) && word.length >= 1){
        dictionary.add(word);
        count++;
      }
    }

    if(count < 100){
      throw new Error("Загружено слишком мало слов: " + count);
    }

    fallbackWords.forEach(word => dictionary.add(word.toLowerCase()));

    dictionaryLoaded = true;
    dictionaryStatus.textContent = count.toLocaleString("ru-RU");
    statusEl.textContent = "✅ Словарь загружен (" + count.toLocaleString() + " слов)";
    statusEl.className = "status ok";

    console.log('Словарь загружен:', count, 'слов');

  }catch(error){

    console.log('Ошибка загрузки словаря:', error.message);
    
    fallbackWords.forEach(word => dictionary.add(word.toLowerCase()));

    dictionaryLoaded = false;
    dictionaryStatus.textContent = "резервный (" + dictionary.size + ")";
    statusEl.textContent = "⚠️ Словарь не загружен. Используется встроенный словарь (" + dictionary.size + " слов).";
    statusEl.className = "status warning";
  }
}


/* =========================================================
   СТАТИСТИКА ТЕКСТА
   ========================================================= */

function getTextStats(text){

  const words = text.match(/[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g) || [];
  const wordCount = words.length;

  const charCount = text.length;

  const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
  const sentenceCount = sentences.length || (text.trim() ? 1 : 0);

  const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
  const paragraphCount = paragraphs.length || (text.trim() ? 1 : 0);

  const totalWordLength = words.reduce((sum, w) => sum + w.length, 0);
  const avgWordLen = wordCount > 0 ? (totalWordLength / wordCount) : 0;

  const longParagraphs = paragraphs.filter(p => p.replace(/\s/g, '').length > 600);

  return {
    wordCount,
    charCount,
    sentenceCount,
    paragraphCount,
    avgWordLen: Math.round(avgWordLen * 10) / 10,
    longParagraphs,
    longParagraphCount: longParagraphs.length
  };
}


/* =========================================================
   ПОИСК ПОВТОРОВ СЛОВ
   ========================================================= */

function findRepeats(text){

  const repeats = [];
  const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];

  const words = text.match(/[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g) || [];

  const wordFrequency = {};
  for(const w of words){
    const lower = w.toLowerCase();
    wordFrequency[lower] = (wordFrequency[lower] || 0) + 1;
  }

  let globalPos = 0;
  for(const sentence of sentences){
    const sentenceWords = sentence.match(/[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g) || [];
    const freqInSentence = {};

    for(const w of sentenceWords){
      const lower = w.toLowerCase();
      freqInSentence[lower] = (freqInSentence[lower] || 0) + 1;
    }

    for(const w of sentenceWords){
      const lower = w.toLowerCase();
      if(freqInSentence[lower] >= 2){
        const pos = text.indexOf(w, globalPos);
        if(pos !== -1){
          repeats.push({
            word: w,
            position: pos,
            type: 'same_sentence'
          });
        }
      }
    }

    globalPos += sentence.length;
  }

  for(const w of words){
    const lower = w.toLowerCase();
    if(wordFrequency[lower] > 3){
      const pos = text.indexOf(w);
      if(pos !== -1 && !repeats.some(r => r.position === pos && r.word === w)){
        repeats.push({
          word: w,
          position: pos,
          type: 'frequent'
        });
      }
    }
  }

  return repeats;
}


/* =========================================================
   ПРОВЕРКА ПУНКТУАЦИИ
   ========================================================= */

function checkPunctuation(text){

  const issues = [];

  const complexWords = ['что', 'который', 'которая', 'которое', 'которые', 'где', 'когда', 'чтобы', 'если', 'потому что'];
  
  for(const word of complexWords){
    const regex = new RegExp(`([а-яё]+)\\s+${word}`, 'gi');
    let match;
    while((match = regex.exec(text)) !== null){
      const before = text.substring(Math.max(0, match.index - 5), match.index);
      if(!before.includes(',')){
        issues.push({
          type: "Возможно, пропущена запятая",
          oldText: match[0],
          newText: match[1] + ', ' + word,
          position: match.index + match[1].length + 1,
          suggestions: [match[1] + ', ' + word]
        });
      }
    }
  }

  if(text.trim() && !/[.!?]\s*$/.test(text.trim())){
    issues.push({
      type: "Пропущена точка в конце текста",
      oldText: text.trim().slice(-10),
      newText: text.trim() + '.',
      position: text.trim().length - 10,
      suggestions: ['.']
    });
  }

  return issues;
}


/* =========================================================
   ЛОКАЛЬНАЯ ПРОВЕРКА
   ========================================================= */

function getLocalIssues(text){

  const issues = [];

  let match;
  const spaces = / {2,}/g;
  while((match = spaces.exec(text)) !== null){
    issues.push({
      type: "Лишние пробелы",
      oldText: match[0],
      newText: " ",
      position: match.index,
      suggestions: [" "]
    });
  }

  const punctuation = / +([,.!?;:])/g;
  while((match = punctuation.exec(text)) !== null){
    issues.push({
      type: "Пробел перед знаком",
      oldText: match[0],
      newText: match[1],
      position: match.index,
      suggestions: [match[1]]
    });
  }

  const repeated = /\b([А-Яа-яЁё]+)\s+\1\b/giu;
  while((match = repeated.exec(text)) !== null){
    issues.push({
      type: "Повтор слова",
      oldText: match[0],
      newText: match[1],
      position: match.index,
      suggestions: [match[1]]
    });
  }

  if(dictionaryLoaded && dictionary.size > 0){
    const wordsRegex = /[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g;
    while((match = wordsRegex.exec(text)) !== null){
      const original = match[0];
      const word = original.toLowerCase();

      if(word.length < 4) continue;
      if(dictionary.has(word)) continue;

      const exists = issues.some(x => x.position === match.index && x.oldText === original);
      if(exists) continue;

      const suggestion = findSuggestion(word);
      if(suggestion){
        issues.push({
          type: "Возможная опечатка",
          oldText: original,
          newText: preserveCase(original, suggestion),
          position: match.index,
          suggestions: [preserveCase(original, suggestion)]
        });
      }
    }
  }

  return issues;
}


/* =========================================================
   ПОИСК БЛИЖАЙШЕГО СЛОВА
   ========================================================= */

function findSuggestion(word){

  let best = null;
  let bestDistance = Infinity;

  for(const candidate of dictionary){

    if(Math.abs(candidate.length - word.length) > 2) continue;
    if(candidate[0] !== word[0] && candidate[0] !== word[0].toLowerCase()) continue;

    const distance = levenshtein(word, candidate);

    if(distance < bestDistance){
      bestDistance = distance;
      best = candidate;
    }
  }

  let threshold = 1;
  if(word.length >= 7) threshold = 2;
  if(word.length >= 11) threshold = 3;

  if(bestDistance <= threshold) return best;
  return null;
}


/* =========================================================
   LEVENSHTEIN
   ========================================================= */

function levenshtein(a,b){
  if(a === b) return 0;
  if(a.length === 0) return b.length;
  if(b.length === 0) return a.length;

  let previous = new Array(b.length + 1);
  let current = new Array(b.length + 1);

  for(let j=0;j<=b.length;j++) previous[j] = j;

  for(let i=1;i<=a.length;i++){
    current[0] = i;
    for(let j=1;j<=b.length;j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      current[j] = Math.min(
        current[j-1] + 1,
        previous[j] + 1,
        previous[j-1] + cost
      );
    }
    [previous,current] = [current,previous];
  }

  return previous[b.length];
}


/* =========================================================
   РЕГИСТР
   ========================================================= */

function preserveCase(original, replacement){
  if(original.length && original[0] === original[0].toUpperCase()){
    return replacement[0].toUpperCase() + replacement.slice(1);
  }
  return replacement;
}


/* =========================================================
   УДАЛЕНИЕ ДУБЛИКАТОВ
   ========================================================= */

function removeDuplicates(issues){
  return issues.filter((item,index,array) =>
    index === array.findIndex(x =>
      x.position === item.position &&
      x.oldText === item.oldText
    )
  );
}


/* =========================================================
   ОСНОВНАЯ ПРОВЕРКА
   ========================================================= */

let currentIssues = [];
let currentRepeats = [];
let isChecking = false;

async function checkText(){

  const text = editor.value;

  if(!text.trim()){
    currentIssues = [];
    currentRepeats = [];
    renderResults();
    updateStats();
    updateHighlighting(text);
    return;
  }

  if(isChecking) return;

  isChecking = true;
  statusEl.textContent = "⏳ Проверка с Яндекс.Спеллер...";
  statusEl.className = "status warning";
  document.querySelector('.primary').disabled = true;

  try{

    const response = await fetch('https://speller.yandex.net/services/spellservice.json/checkText', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: 'text=' + encodeURIComponent(text) + '&lang=ru&options=1'
    });

    if(!response.ok){
      throw new Error('Яндекс.Спеллер недоступен');
    }

    const data = await response.json();

    const yandexIssues = data.map(error => ({
      type: "Яндекс.Спеллер",
      oldText: error.word,
      newText: error.s && error.s.length > 0 ? error.s[0] : error.word,
      position: error.pos,
      suggestions: error.s || []
    }));

    const localIssues = getLocalIssues(text);
    const punctuationIssues = checkPunctuation(text);

    currentIssues = [...yandexIssues, ...localIssues, ...punctuationIssues];
    currentIssues.sort((a,b) => a.position - b.position);
    currentIssues = removeDuplicates(currentIssues);

    currentRepeats = findRepeats(text);

    renderResults();
    updateStats();
    updateHighlighting(text);

    statusEl.textContent = "✅ Проверка завершена. Найдено " + currentIssues.length + " ошибок и " + currentRepeats.length + " повторов.";
    statusEl.className = currentIssues.length > 0 ? "status error" : "status ok";

  }catch(error){

    console.log('Ошибка Яндекс.Спеллер:', error);
    statusEl.textContent = "⚠️ Яндекс.Спеллер недоступен. Используем локальную проверку.";
    statusEl.className = "status warning";

    currentIssues = getLocalIssues(text);
    const punctuationIssues = checkPunctuation(text);
    currentIssues = [...currentIssues, ...punctuationIssues];
    currentIssues.sort((a,b) => a.position - b.position);
    currentIssues = removeDuplicates(currentIssues);

    currentRepeats = findRepeats(text);

    renderResults();
    updateStats();
    updateHighlighting(text);

  }finally{
    isChecking = false;
    document.querySelector('.primary').disabled = false;
  }
}


/* =========================================================
   ПОДСВЕТКА ТЕКСТА
   ========================================================= */

function updateHighlighting(text){

  if(!text.trim()){
    highlightOverlay.innerHTML = '';
    return;
  }

  let html = '';

  const stats = getTextStats(text);
  const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
  let currentPos = 0;

  const longParagraphRanges = [];
  for(const p of paragraphs){
    const cleanP = p.replace(/\s/g, '');
    if(cleanP.length > 600){
      const start = text.indexOf(p, currentPos);
      const end = start + p.length;
      longParagraphRanges.push({ start, end });
    }
    currentPos = text.indexOf(p, currentPos) + p.length;
  }

  const highlights = [];

  for(const error of currentIssues){
    highlights.push({
      start: error.position,
      end: error.position + error.oldText.length,
      text: error.oldText,
      className: 'highlight-error'
    });
  }

  for(const repeat of currentRepeats){
    const overlaps = highlights.some(h =>
      repeat.position >= h.start && repeat.position < h.end
    );
    if(!overlaps){
      highlights.push({
        start: repeat.position,
        end: repeat.position + repeat.word.length,
        text: repeat.word,
        className: 'highlight-repeat'
      });
    }
  }

  for(const range of longParagraphRanges){
    highlights.push({
      start: range.start,
      end: range.end,
      text: text.substring(range.start, range.end),
      className: 'highlight-long-paragraph'
    });
  }

  highlights.sort((a,b) => a.start - b.start);

  let lastIndex = 0;
  for(const h of highlights){
    if(h.start > lastIndex){
      html += escapeHTML(text.substring(lastIndex, h.start));
    }
    html += `<span class="${h.className}">${escapeHTML(h.text)}</span>`;
    lastIndex = h.end;
  }

  if(lastIndex < text.length){
    html += escapeHTML(text.substring(lastIndex));
  }

  highlightOverlay.innerHTML = html;
}


/* =========================================================
   СТАТИСТИКА
   ========================================================= */

function updateStats(){

  const text = editor.value;
  const stats = getTextStats(text);

  wordsEl.textContent = stats.wordCount;
  charsEl.textContent = stats.charCount;
  sentencesEl.textContent = stats.sentenceCount;
  paragraphsEl.textContent = stats.paragraphCount;
  avgWordLenEl.textContent = stats.avgWordLen;
  errorsEl.textContent = currentIssues.length + currentRepeats.length;
  badgeEl.textContent = currentIssues.length + currentRepeats.length;

  if(stats.longParagraphCount > 0){
    statusEl.textContent = `⚠️ Найдено ${stats.longParagraphCount} абзацев длиннее 600 символов.`;
    statusEl.className = "status warning";
  }

  badgeEl.className = (currentIssues.length + currentRepeats.length) === 0 ? "badge zero" : "badge";
}


/* =========================================================
   ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ
   ========================================================= */

function renderResults(){

  const allIssues = [...currentIssues];

  for(const repeat of currentRepeats){
    allIssues.push({
      type: "🔵 Повтор слова",
      oldText: repeat.word,
      newText: repeat.word + ' (повтор)',
      position: repeat.position,
      suggestions: []
    });
  }

  allIssues.sort((a,b) => a.position - b.position);

  if(!allIssues.length){
    results.innerHTML = `
      <div class="empty">
        <div class="success">✓ Ошибок не найдено</div>
        <div style="margin-top:8px">Текст выглядит хорошо.</div>
      </div>
    `;
    return;
  }

  results.innerHTML = "";

  allIssues.forEach((issue, index) => {

    const item = document.createElement("div");
    item.className = "issue";

    let suggestionsHtml = "";
    if(issue.suggestions && issue.suggestions.length > 1){
      suggestionsHtml = `
        <div class="suggestions">
          ${issue.suggestions.slice(0,5).map(s =>
            `<button onclick="applySuggestion(${index}, '${escapeHTML(s)}')">${escapeHTML(s)}</button>`
          ).join('')}
        </div>
      `;
    }

    item.innerHTML = `
      <div class="issue-title">
        ${escapeHTML(issue.type)}
        <span class="tag">#${index + 1}</span>
      </div>
      <div class="issue-text">
        <span class="wrong">${escapeHTML(showSpaces(issue.oldText))}</span>
        →
        <span class="correct">${escapeHTML(showSpaces(issue.newText))}</span>
      </div>
      ${suggestionsHtml}
      ${issue.suggestions && issue.suggestions.length > 0 ? `<button class="fix" onclick="applyIssue(${index})">Исправить</button>` : ''}
    `;

    results.appendChild(item);
  });
}


/* =========================================================
   ПРИМЕНИТЬ ИСПРАВЛЕНИЕ
   ========================================================= */

function applyIssue(index){

  const allIssues = [...currentIssues];

  for(const repeat of currentRepeats){
    allIssues.push({
      type: "Повтор слова",
      oldText: repeat.word,
      newText: repeat.word + ' (повтор)',
      position: repeat.position,
      suggestions: []
    });
  }

  allIssues.sort((a,b) => a.position - b.position);

  const issue = allIssues[index];
  if(!issue || !issue.suggestions || issue.suggestions.length === 0) return;

  const text = editor.value;

  editor.value =
    text.slice(0, issue.position) +
    issue.newText +
    text.slice(issue.position + issue.oldText.length);

  checkText();
}

function applySuggestion(index, suggestion){

  const allIssues = [...currentIssues];

  for(const repeat of currentRepeats){
    allIssues.push({
      type: "Повтор слова",
      oldText: repeat.word,
      newText: repeat.word + ' (повтор)',
      position: repeat.position,
      suggestions: []
    });
  }

  allIssues.sort((a,b) => a.position - b.position);

  const issue = allIssues[index];
  if(!issue) return;

  const text = editor.value;

  editor.value =
    text.slice(0, issue.position) +
    suggestion +
    text.slice(issue.position + issue.oldText.length);

  checkText();
}


/* =========================================================
   ИСПРАВИТЬ ВСЁ
   ========================================================= */

function fixAll(){

  checkText();

  const allIssues = [...currentIssues];

  for(const repeat of currentRepeats){
    allIssues.push({
      type: "Повтор слова",
      oldText: repeat.word,
      newText: repeat.word + ' (повтор)',
      position: repeat.position,
      suggestions: []
    });
  }

  allIssues.sort((a,b) => a.position - b.position);

  const fixable = allIssues.filter(i => i.suggestions && i.suggestions.length > 0);
  if(!fixable.length) return;

  const sorted = [...fixable].sort((a,b) => b.position - a.position);
  let text = editor.value;

  for(const issue of sorted){
    text =
      text.slice(0, issue.position) +
      issue.newText +
      text.slice(issue.position + issue.oldText.length);
  }

  editor.value = text;
  checkText();
}


/* =========================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
   ========================================================= */

function showSpaces(value){
  return value.replace(/ /g, "␠").replace(/\t/g, "⇥");
}

function escapeHTML(value){
  return value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   ОЧИСТИТЬ
   ========================================================= */

function clearText(){

  editor.value = "";
  currentIssues = [];
  currentRepeats = [];

  results.innerHTML = `<div class="empty">Введите текст и нажмите «Проверить».</div>`;
  updateStats();
  updateHighlighting('');
  statusEl.textContent = "Готово к проверке.";
  statusEl.className = "status";
}

/* =========================================================
   АВТОПРОВЕРКА ПРИ ВВОДЕ
   ========================================================= */

let autoCheckTimeout;

editor.addEventListener('input', function(){
  clearTimeout(autoCheckTimeout);
  autoCheckTimeout = setTimeout(() => {
    if(this.value.trim().length > 10){
      checkText();
    } else {
      updateStats();
      updateHighlighting(this.value);
    }
  }, 1500);
});


/* =========================================================
   ЗАПУСК
   ========================================================= */

updateStats();
loadDictionary();
