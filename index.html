<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ТекстОК — проверка русского текста</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#20222b;
  background:
    radial-gradient(circle at 0 0,#e8e5ff,transparent 35%),
    radial-gradient(circle at 100% 100%,#ddf7ef,transparent 35%),
    #f5f6fa;
}

.container{
  width:min(1100px,calc(100% - 30px));
  margin:auto;
  padding:35px 0 60px;
}

header{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  font-size:42px;
  font-weight:850;
  letter-spacing:-1.5px;
}

.logo span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  margin-right:8px;
  border-radius:15px;
  background:#655cf5;
  color:white;
}

.subtitle{
  color:#777b86;
  margin-top:10px;
}

.card{
  background:rgba(255,255,255,.94);
  border:1px solid #e7e7ec;
  border-radius:24px;
  padding:22px;
  margin-top:20px;
  box-shadow:0 18px 50px #22223810;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  transform:translateY(-1px);
}

.primary{
  background:#655cf5;
  color:#fff;
}

.secondary{
  background:#eceaff;
  color:#5148d8;
}

.light{
  background:#f0f1f5;
  color:#555a68;
}

textarea{
  width:100%;
  min-height:390px;
  resize:vertical;
  border:1px solid #dedfe5;
  border-radius:18px;
  padding:20px;
  outline:none;
  background:#fbfbfd;
  color:#20222b;
  font:18px/1.65 inherit;
}

textarea:focus{
  border-color:#655cf5;
  box-shadow:0 0 0 4px #655cf515;
  background:#fff;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:15px;
}

.stat{
  background:#f1f2f6;
  padding:8px 12px;
  border-radius:10px;
  color:#686d78;
  font-size:14px;
}

.status{
  margin-top:12px;
  font-size:14px;
  color:#777b86;
}

.status.ok{
  color:#15966d;
}

.status.error{
  color:#d73d3d;
}

.results-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  min-width:32px;
  height:32px;
  padding:0 9px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#fff0f0;
  color:#d73d3d;
  font-weight:800;
}

.empty{
  padding:35px;
  text-align:center;
  color:#777b86;
}

.success{
  color:#15966d;
  font-weight:800;
}

.issue{
  padding:15px;
  border:1px solid #ececf1;
  border-radius:15px;
  margin-top:10px;
}

.issue-title{
  font-weight:800;
}

.issue-text{
  margin-top:8px;
  color:#646874;
}

.wrong{
  color:#d63e3e;
  text-decoration:underline wavy #d63e3e;
  font-weight:750;
}

.correct{
  color:#15966d;
  font-weight:750;
}

.fix{
  margin-top:10px;
  padding:8px 12px;
  background:#f0efff;
  color:#5148d8;
  font-size:14px;
}

@media(max-width:600px){
  .container{
    width:calc(100% - 18px);
    padding-top:20px;
  }

  .logo{
    font-size:34px;
  }

  .card{
    padding:15px;
    border-radius:18px;
  }

  textarea{
    min-height:320px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>

  <div class="logo">
    <span>✓</span>ТекстОК
  </div>

  <div class="subtitle">
    Проверка русского текста, опечаток,
    повторов и лишних пробелов
  </div>

</header>


<section class="card">

  <div class="toolbar">

    <button class="primary" onclick="checkText()">
      🔎 Проверить
    </button>

    <button class="secondary" onclick="fixAll()">
      ✨ Исправить всё
    </button>

    <button class="light" onclick="demo()">
      Демо
    </button>

    <button class="light" onclick="clearText()">
      Очистить
    </button>

  </div>


  <textarea
    id="editor"
    placeholder="Вставьте сюда русский текст..."
  ></textarea>


  <div class="stats">

    <div class="stat">
      Слов: <b id="words">0</b>
    </div>

    <div class="stat">
      Символов: <b id="chars">0</b>
    </div>

    <div class="stat">
      Ошибок: <b id="errors">0</b>
    </div>

    <div class="stat">
      Словарь: <b id="dictionaryStatus">загрузка...</b>
    </div>

  </div>

  <div id="status" class="status">
    Загружаем словарь...
  </div>

</section>


<section class="card">

  <div class="results-head">

    <h2>Результаты</h2>

    <div id="badge" class="badge">0</div>

  </div>


  <div id="results">

    <div class="empty">
      Введите текст и нажмите «Проверить».
    </div>

  </div>

</section>

</div>


<script>

/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

// 
const DICTIONARY_FILE = "https://raw.githubusercontent.com/ffvy7phzfb-dot/texxtokk/refs/heads/main/dictionary.txt";

const editor = document.getElementById("editor");
const results = document.getElementById("results");
const statusEl = document.getElementById("status");

const wordsEl = document.getElementById("words");
const charsEl = document.getElementById("chars");
const errorsEl = document.getElementById("errors");
const badgeEl = document.getElementById("badge");
const dictionaryStatus =
  document.getElementById("dictionaryStatus");


/* =========================================================
   СЛОВАРЬ
   ========================================================= */

let dictionary = new Set();

let dictionaryLoaded = false;


/* =========================================================
   НЕБОЛЬШОЙ РЕЗЕРВНЫЙ СЛОВАРЬ
   ========================================================= */

const fallbackWords = `
я ты он она оно мы вы они
и а но или да нет
это тот эта это эти
как что где когда почему
кто какой которая который которые
быть есть был была были будет
делать сделать сделал сделали
сказать говорить говорил
идти пойти ходить
знать понимать думать
хотеть мочь должен
можно нельзя нужно
человек люди время день год
сегодня завтра вчера
текст слово предложение
русский язык программа компьютер
сайт работа помощь
привет спасибо пожалуйста
хороший хороший хорошо
проверка ошибка ошибка
`.trim().split(/\s+/);


/* =========================================================
   ЗАГРУЗКА СЛОВАРЯ
   ========================================================= */

async function loadDictionary(){

  dictionaryStatus.textContent = "загрузка";

  try{

    const response =
      await fetch(DICTIONARY_FILE, {
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error("dictionary.txt не найден");
    }

    const data = await response.text();

    const lines =
      data.split(/\r?\n/);

    for(let line of lines){

      line = line.trim().toLowerCase();

      if(!line) continue;

      const word =
        line.split(/\s+/)[0];

      if(
        /^[а-яё-]+$/i.test(word) &&
        word.length >= 1
      ){
        dictionary.add(word);
      }
    }

    fallbackWords.forEach(
      word => dictionary.add(word.toLowerCase())
    );

    dictionaryLoaded = true;

    dictionaryStatus.textContent =
      dictionary.size.toLocaleString("ru-RU");

    statusEl.textContent =
      "Словарь загружен. Можно проверять текст.";

    statusEl.className = "status ok";

  }catch(error){

    fallbackWords.forEach(
      word => dictionary.add(word.toLowerCase())
    );

    dictionaryLoaded = false;

    dictionaryStatus.textContent =
      "резервный";

    statusEl.textContent =
      "dictionary.txt не найден. Используется небольшой встроенный словарь.";

    statusEl.className = "status error";
  }
}


/* =========================================================
   СТАТИСТИКА
   ========================================================= */

function updateStats(){

  const text = editor.value;

  const words =
    text.match(/[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g) || [];

  wordsEl.textContent = words.length;

  charsEl.textContent = text.length;

  errorsEl.textContent = currentIssues.length;

  badgeEl.textContent = currentIssues.length;
}


/* =========================================================
   ОПЕЧАТКИ
   ========================================================= */

const typoMap = {

  "превет":"привет",
  "спосибо":"спасибо",
  "пожалуста":"пожалуйста",

  "извените":"извините",
  "извеняюсь":"извиняюсь",

  "сигодня":"сегодня",
  "завтро":"завтра",

  "сдесь":"здесь",
  "зделать":"сделать",
  "зделал":"сделал",

  "чяй":"чай",
  "малако":"молоко",

  "погодда":"погода",
  "програма":"программа",

  "компютер":"компьютер",

  "вообщем":"в общем",
  "вобщем":"в общем",

  "незнаю":"не знаю",
  "какбудто":"как будто"
};


/* =========================================================
   ТЕКУЩИЕ ОШИБКИ
   ========================================================= */

let currentIssues = [];


/* =========================================================
   ПРОВЕРКА
   ========================================================= */

function checkText(){

  const text = editor.value;

  currentIssues = [];


  /*
   ---------------------------------------------------------
   ЛИШНИЕ ПРОБЕЛЫ
   ---------------------------------------------------------
  */

  let match;

  const spaces = / {2,}/g;

  while((match = spaces.exec(text)) !== null){

    currentIssues.push({

      type:"Лишние пробелы",

      oldText:match[0],

      newText:" ",

      position:match.index

    });
  }


  /*
   ---------------------------------------------------------
   TAB
   ---------------------------------------------------------
  */

  const tabs = /\t+/g;

  while((match = tabs.exec(text)) !== null){

    currentIssues.push({

      type:"Табуляция",

      oldText:match[0],

      newText:" ",

      position:match.index

    });
  }


  /*
   ---------------------------------------------------------
   ПРОБЕЛ ПЕРЕД ПУНКТУАЦИЕЙ
   ---------------------------------------------------------
  */

  const punctuation =
    / +([,.!?;:])/g;

  while((match = punctuation.exec(text)) !== null){

    currentIssues.push({

      type:"Пробел перед знаком",

      oldText:match[0],

      newText:match[1],

      position:match.index

    });
  }


  /*
   ---------------------------------------------------------
   ПОВТОРЫ СЛОВ
   ---------------------------------------------------------
  */

  const repeated =
    /\b([А-Яа-яЁё]+)\s+\1\b/giu;

  while((match = repeated.exec(text)) !== null){

    currentIssues.push({

      type:"Повтор слова",

      oldText:match[0],

      newText:match[1],

      position:match.index

    });
  }


  /*
   ---------------------------------------------------------
   СЛОВАРНЫЕ ОПЕЧАТКИ
   ---------------------------------------------------------
  */

  for(const typo in typoMap){

    const regex =
      new RegExp(
        "\\b" +
        escapeRegExp(typo) +
        "\\b",
        "giu"
      );

    while((match = regex.exec(text)) !== null){

      currentIssues.push({

        type:"Опечатка",

        oldText:match[0],

        newText:preserveCase(
          match[0],
          typoMap[typo]
        ),

        position:match.index

      });
    }
  }


  /*
   ---------------------------------------------------------
   ПРОВЕРКА ПО СЛОВАРЮ
   ---------------------------------------------------------
  */

  const wordsRegex =
    /[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g;


  while((match = wordsRegex.exec(text)) !== null){

    const original = match[0];

    const word =
      original.toLowerCase();


    if(word.length < 4) continue;


    if(dictionary.has(word)) continue;


    if(
      currentIssues.some(
        x =>
          x.position === match.index &&
          x.oldText === original
      )
    ){
      continue;
    }


    const suggestion =
      findSuggestion(word);


    if(suggestion){

      currentIssues.push({

        type:"Возможная опечатка",

        oldText:original,

        newText:preserveCase(
          original,
          suggestion
        ),

        position:match.index

      });
    }
  }


  /*
   ---------------------------------------------------------
   СОРТИРОВКА
   ---------------------------------------------------------
  */

  currentIssues.sort(
    (a,b) => a.position - b.position
  );


  /*
   ---------------------------------------------------------
   ДУБЛИКАТЫ
   ---------------------------------------------------------
  */

  currentIssues =
    currentIssues.filter(
      (item,index,array) =>

        index === array.findIndex(
          x =>
            x.position === item.position &&
            x.oldText === item.oldText &&
            x.newText === item.newText
        )
    );


  renderResults();

  updateStats();
}


/* =========================================================
   ПОИСК БЛИЖАЙШЕГО СЛОВА
   ========================================================= */

function findSuggestion(word){

  let best = null;

  let bestDistance = Infinity;


  for(const candidate of dictionary){

    if(
      Math.abs(candidate.length - word.length) > 2
    ){
      continue;
    }


    if(
      candidate[0] !== word[0] &&
      candidate[0] !== word[0].toLowerCase()
    ){
      continue;
    }


    const distance =
      levenshtein(word,candidate);


    if(distance < bestDistance){

      bestDistance = distance;

      best = candidate;
    }
  }


  let threshold = 1;

  if(word.length >= 7){
    threshold = 2;
  }

  if(word.length >= 11){
    threshold = 3;
  }


  if(bestDistance <= threshold){
    return best;
  }


  return null;
}


/* =========================================================
   LEVENSHTEIN
   ========================================================= */

function levenshtein(a,b){

  if(a === b) return 0;

  if(a.length === 0) return b.length;

  if(b.length === 0) return a.length;


  let previous =
    new Array(b.length + 1);


  let current =
    new Array(b.length + 1);


  for(let j=0;j<=b.length;j++){
    previous[j] = j;
  }


  for(let i=1;i<=a.length;i++){

    current[0] = i;


    for(let j=1;j<=b.length;j++){

      const cost =
        a[i-1] === b[j-1]
          ? 0
          : 1;


      current[j] =
        Math.min(

          current[j-1] + 1,

          previous[j] + 1,

          previous[j-1] + cost

        );
    }


    [previous,current] =
      [current,previous];
  }


  return previous[b.length];
}


/* =========================================================
   REGEX ESCAPE
   ========================================================= */

function escapeRegExp(value){

  return value.replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
  );
}


/* =========================================================
   РЕГИСТР
   ========================================================= */

function preserveCase(original,replacement){

  if(
    original.length &&
    original[0] ===
    original[0].toUpperCase()
  ){

    return replacement[0].toUpperCase()
      + replacement.slice(1);
  }

  return replacement;
}


/* =========================================================
   ОТОБРАЖЕНИЕ
   ========================================================= */

function renderResults(){

  if(!currentIssues.length){

    results.innerHTML = `

      <div class="empty">

        <div class="success">
          ✓ Ошибок не найдено
        </div>

        <div style="margin-top:8px">
          Текст выглядит хорошо.
        </div>

      </div>
    `;

    return;
  }


  results.innerHTML = "";


  currentIssues.forEach(
    (issue,index) => {

      const item =
        document.createElement("div");

      item.className = "issue";


      item.innerHTML = `

        <div class="issue-title">
          ${escapeHTML(issue.type)}
        </div>

        <div class="issue-text">

          <span class="wrong">
            ${escapeHTML(
              showSpaces(issue.oldText)
            )}
          </span>

          →

          <span class="correct">
            ${escapeHTML(
              showSpaces(issue.newText)
            )}
          </span>

        </div>

        <button
          class="fix"
          onclick="applyIssue(${index})"
        >
          Исправить
        </button>

      `;


      results.appendChild(item);
    }
  );
}


/* =========================================================
   ВИДИМЫЕ ПРОБЕЛЫ
   ========================================================= */

function showSpaces(value){

  return value
    .replace(/ /g,"␠")
    .replace(/\t/g,"⇥");
}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value){

  return value
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   ИСПРАВИТЬ ОДНУ
   ========================================================= */

function applyIssue(index){

  const issue =
    currentIssues[index];

  if(!issue) return;


  const text = editor.value;


  editor.value =
    text.slice(0,issue.position) +
    issue.newText +
    text.slice(
      issue.position +
      issue.oldText.length
    );


  checkText();
}


/* =========================================================
   ИСПРАВИТЬ ВСЁ
   ========================================================= */

function fixAll(){

  checkText();


  if(!currentIssues.length){
    return;
  }


  const sorted =
    [...currentIssues]
      .sort(
        (a,b) =>
          b.position - a.position
      );


  let text =
    editor.value;


  for(const issue of sorted){

    text =
      text.slice(
        0,
        issue.position
      ) +

      issue.newText +

      text.slice(
        issue.position +
        issue.oldText.length
      );
  }


  editor.value = text;


  checkText();
}


/* =========================================================
   ОЧИСТИТЬ
   ========================================================= */

function clearText(){

  editor.value = "";

  currentIssues = [];

  results.innerHTML = `
    <div class="empty">
      Введите текст и нажмите «Проверить».
    </div>
  `;

  updateStats();
}


/* =========================================================
   ДЕМО
   ========================================================= */

function demo(){

  editor.value =
`Превет!  Это мой тестовый текcт.

Сигодня я  хотел зделать хороший сайт , но  пока незнаю какбудто он будет работать.

Спасибо  большое за помощь!`;

  checkText();
}


/* =========================================================
   ЗАПУСК
   ========================================================= */

updateStats();

loadDictionary();

</script>

</body>
</html>
