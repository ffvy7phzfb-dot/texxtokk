<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrenerChek — проверка текста</title>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      color: #20222b;
      background: radial-gradient(circle at 0 0, #e8e5ff, transparent 35%),
        radial-gradient(circle at 100% 100%, #ddf7ef, transparent 35%),
        #f5f6fa;
      transition: all 0.3s;
    }

    body.dark-mode {
      color: #e8e8e8;
      background: #1a1a2e;
    }
    body.dark-mode .card {
      background: rgba(30, 30, 50, 0.95);
      border-color: #3a3a5a;
    }
    body.dark-mode .stat {
      background: #2a2a4a;
      color: #a0a0b0;
    }
    body.dark-mode .stat b {
      color: #e0e0f0;
    }
    body.dark-mode .status {
      background: #2a2a4a;
      color: #a0a0b0;
    }
    body.dark-mode .editor-box {
      background: #1e1e3a;
      border-color: #3a3a5a;
    }
    body.dark-mode textarea {
      color: #e8e8e8;
    }
    body.dark-mode #fixedText {
      background: #1e1e3a;
      color: #e8e8e8;
    }
    body.dark-mode .empty {
      color: #a0a0b0;
    }
    body.dark-mode .issue {
      background: #2a2a4a;
      border-color: #3a3a5a;
    }
    body.dark-mode .issue-title {
      color: #e8e8e8;
    }
    body.dark-mode .issue-text {
      color: #a0a0b0;
    }
    body.dark-mode .fix {
      background: #3a3a6a;
      color: #b0b0f0;
    }
    body.dark-mode .fix:hover {
      background: #4a4a8a;
    }
    body.dark-mode .light {
      background: #2a2a4a;
      color: #b0b0d0;
    }
    body.dark-mode .light:hover {
      background: #3a3a6a;
    }
    body.dark-mode .secondary {
      background: #3a3a6a;
      color: #b0b0f0;
    }
    body.dark-mode .secondary:hover {
      background: #4a4a8a;
    }
    body.dark-mode .badge {
      background: #3a2a2a;
      color: #ff6b6b;
    }
    body.dark-mode .badge.zero {
      background: #2a3a2a;
      color: #6bff6b;
    }
    body.dark-mode .editor-header .label {
      color: #a0a0b0;
    }
    body.dark-mode .issue-actions .skip {
      background: #3a3a4a;
      color: #a0a0b0;
    }
    body.dark-mode .issue-actions .skip:hover {
      background: #4a4a5a;
    }
    body.dark-mode .copy-toast {
      background: #e8e8e8;
      color: #20222b;
    }
    body.dark-mode .theme-toggle {
      background: #2a2a4a;
      color: #f0d050;
    }
    body.dark-mode .features {
      background: rgba(30, 30, 50, 0.5);
      color: #a0a0b0;
    }
    body.dark-mode .results-head h2 {
      color: #e8e8e8;
    }
    body.dark-mode .suggestions button {
      background: #2a2a4a;
      border-color: #3a3a5a;
      color: #e0e0f0;
    }
    body.dark-mode .suggestions button:hover {
      background: #3a3a6a;
      border-color: #655cf5;
    }
    body.dark-mode .text-wrapper {
      background: #1e1e3a;
    }
    body.dark-mode .editor-box:focus-within {
      border-color: #655cf5;
    }
    body.dark-mode .logo span {
      background: #655cf5;
    }

    /* ===== ОБЩИЕ СТИЛИ ===== */
    .container {
      width: min(1200px, calc(100% - 30px));
      margin: auto;
      padding: 35px 0 60px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo {
      font-size: 42px;
      font-weight: 850;
      letter-spacing: -1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: #655cf5;
      color: white;
      transition: all 0.3s;
    }
    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .theme-toggle {
      background: #f0f1f5;
      border: 0;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .theme-toggle:hover {
      transform: rotate(20deg);
      box-shadow: 0 4px 12px #00000020;
    }
    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #e7e7ec;
      border-radius: 24px;
      padding: 22px;
      margin-top: 20px;
      box-shadow: 0 18px 50px #22223810;
      transition: all 0.3s;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 17px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px #00000020;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }
    .primary {
      background: #655cf5;
      color: #fff;
    }
    .secondary {
      background: #eceaff;
      color: #5148d8;
    }
    .light {
      background: #f0f1f5;
      color: #555a68;
    }
    .success-btn {
      background: #15966d;
      color: #fff;
    }
    .success-btn:hover {
      background: #0d7a56;
    }
    .editor-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 15px;
    }
    .editor-box {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #dedfe5;
      background: #fbfbfd;
      transition: all 0.3s;
    }
    .editor-box:focus-within {
      border-color: #655cf5;
      box-shadow: 0 0 0 4px #655cf515;
    }
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid #e7e7ec;
      border-radius: 18px 18px 0 0;
      backdrop-filter: blur(4px);
    }
    .editor-header .label {
      font-size: 12px;
      font-weight: 700;
      color: #777b86;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .editor-header .label.error {
      background: rgba(255, 235, 238, 0.7);
      color: #d73d3d;
    }
    .editor-header .label.success {
      background: rgba(232, 245, 233, 0.7);
      color: #15966d;
    }
    .text-wrapper {
      position: relative;
      border-radius: 0 0 18px 18px;
      overflow: hidden;
      min-height: 400px;
    }
    textarea {
      width: 100%;
      min-height: 400px;
      resize: vertical;
      border: 0;
      padding: 20px;
      outline: none;
      background: transparent;
      color: #20222b;
      font: 18px/1.65 inherit;
      position: relative;
      z-index: 2;
    }
    .editor-box .highlight-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
      padding: 20px;
      font: 18px/1.65 inherit;
      color: transparent;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow: hidden;
      border-radius: 0 0 18px 18px;
      width: 100%;
      height: 100%;
    }
    #fixedText {
      background: #f8f9fe;
      color: #20222b;
      padding: 20px;
      min-height: 400px;
      font: 18px/1.65 inherit;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-y: auto;
      transition: all 0.3s;
      border-radius: 0 0 18px 18px;
    }

    /* ===== ПОДСВЕТКА ОШИБОК ===== */
    .highlight-error {
      background: #ff000030;
      border-bottom: 2px wavy #ff0000;
      border-radius: 2px;
      cursor: help;
      position: relative;
    }
    .highlight-repeat {
      background: #1a73e830;
      border-bottom: 2px solid #1a73e8;
      border-radius: 2px;
      cursor: help;
      position: relative;
    }

    /* ===== ВСПЛЫВАЮЩИЕ ПОДСКАЗКИ ===== */
    .highlight-overlay .tooltip-trigger {
      position: relative;
      cursor: help;
    }

    .highlight-overlay .tooltip-trigger .tooltip-text {
      visibility: hidden;
      opacity: 0;
      width: 260px;
      background: #20222b;
      color: #fff;
      text-align: left;
      border-radius: 10px;
      padding: 10px 14px;
      position: absolute;
      z-index: 1000;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%);
      transition: opacity 0.2s ease, visibility 0.2s ease;
      font-size: 13px;
      font-weight: 400;
      font-family: Inter, system-ui, sans-serif;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      line-height: 1.5;
      pointer-events: none;
      white-space: normal;
      word-wrap: break-word;
    }

    .highlight-overlay .tooltip-trigger .tooltip-text::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: #20222b;
    }

    .highlight-overlay .tooltip-trigger:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }

    .highlight-overlay .tooltip-trigger .tooltip-text .tip-type {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      margin-bottom: 3px;
      display: block;
    }

    .highlight-overlay .tooltip-trigger .tooltip-text .tip-suggestion {
      color: #6bcb77;
      font-weight: 600;
      display: block;
      margin-top: 3px;
    }

    body.dark-mode .highlight-overlay .tooltip-trigger .tooltip-text {
      background: #2a2a3e;
      color: #e8e8e8;
    }

    body.dark-mode .highlight-overlay .tooltip-trigger .tooltip-text::after {
      border-top-color: #2a2a3e;
    }

    /* ===== СТАТИСТИКА ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 15px;
    }
    .stat {
      background: #f1f2f6;
      padding: 8px 12px;
      border-radius: 10px;
      color: #686d78;
      font-size: 13px;
      text-align: center;
      transition: all 0.3s;
    }
    .stat b {
      color: #20222b;
      font-size: 15px;
      transition: all 0.3s;
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      color: #777b86;
      padding: 8px 14px;
      border-radius: 10px;
      background: #f8f8fb;
      transition: all 0.3s;
    }
    .status.ok {
      background: #e8f5e9;
      color: #15966d;
    }
    .status.error {
      background: #ffebee;
      color: #d73d3d;
    }
    .status.warning {
      background: #fff8e1;
      color: #e6a700;
    }
    .results-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      min-width: 32px;
      height: 32px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #fff0f0;
      color: #d73d3d;
      font-weight: 800;
      font-size: 15px;
      transition: all 0.3s;
    }
    .badge.zero {
      background: #e8f5e9;
      color: #15966d;
    }
    .empty {
      padding: 35px;
      text-align: center;
      color: #777b86;
    }
    .success {
      color: #15966d;
      font-weight: 800;
    }
    .issue {
      padding: 15px;
      border: 1px solid #ececf1;
      border-radius: 15px;
      margin-top: 10px;
      background: #fafafe;
      transition: all 0.2s;
    }
    .issue:hover {
      border-color: #655cf5;
      box-shadow: 0 2px 12px #655cf515;
    }
    .issue-title {
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .issue-title .tag {
      font-size: 11px;
      font-weight: 600;
      background: #655cf515;
      color: #655cf5;
      padding: 2px 10px;
      border-radius: 20px;
    }
    .issue-text {
      margin-top: 8px;
      color: #646874;
      word-break: break-word;
      max-width: 100%;
    }
    .wrong {
      color: #d63e3e;
      text-decoration: underline wavy #d63e3e;
      font-weight: 750;
    }
    .correct {
      color: #15966d;
      font-weight: 750;
    }
    .issue-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .issue-actions .fix {
      margin-top: 0;
    }
    .issue-actions .skip {
      padding: 8px 16px;
      background: #f0f1f5;
      color: #555a68;
      font-size: 14px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
    }
    .issue-actions .skip:hover {
      background: #e0e1e5;
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .suggestions button {
      padding: 4px 12px;
      border: 1px solid #dedfe5;
      border-radius: 8px;
      background: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .suggestions button:hover {
      border-color: #655cf5;
      background: #f5f3ff;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px #655cf515;
    }
    .copy-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #20222b;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .copy-toast.show {
      opacity: 1;
    }
    .features {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      padding: 10px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      font-size: 13px;
      color: #555a68;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(0, 0, 0, 0.04);
      transition: all 0.3s;
    }

    @media(max-width: 768px) {
      .editor-wrapper {
        grid-template-columns: 1fr;
      }
      .highlight-overlay .tooltip-trigger .tooltip-text {
        width: 180px;
        font-size: 11px;
        padding: 8px 10px;
        bottom: 120%;
      }
    }
    @media(max-width: 600px) {
      .container {
        width: calc(100% - 18px);
        padding-top: 20px;
      }
      .logo {
        font-size: 34px;
      }
      .card {
        padding: 15px;
        border-radius: 18px;
      }
      textarea {
        min-height: 250px;
        font-size: 16px;
      }
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">
        <span>✓</span>TrenerChek
      </div>
      <div class="header-controls">
        <button class="theme-toggle" onclick="toggleTheme()" title="Тёмная тема">🌙</button>
      </div>
    </header>

    <div class="features">
      <span>🔍 Опечатки</span>
      <span>📝 Лишние пробелы</span>
      <span>🔁 Повторы слов</span>
      <span>📊 Статистика</span>
    </div>

    <section class="card">
      <div class="toolbar">
        <button class="primary" onclick="checkText()">🔎 Проверить</button>
        <button class="secondary" onclick="fixAll()">✨ Исправить всё</button>
        <button class="success-btn" onclick="copyText()">📋 Копировать</button>
        <button class="light" onclick="demo()">Демо</button>
        <button class="light" onclick="clearText()">Очистить</button>
        <button class="light" onclick="pasteFromClipboard()" style="background:#e3f2fd; color:#0d47a1;">📋 Вставить</button>
      </div>

      <div class="editor-wrapper">
        <div class="editor-box">
          <div class="editor-header">
            <span class="label error">📝 Исходный</span>
          </div>
          <div class="text-wrapper">
            <textarea id="editor" placeholder="Вставьте сюда русский текст..."></textarea>
            <div id="highlightOverlay" class="highlight-overlay"></div>
          </div>
        </div>

        <div class="editor-box">
          <div class="editor-header">
            <span class="label success">✅ Исправленный</span>
            <button class="success-btn" onclick="copyText()" style="padding:4px 12px; font-size:12px;">📋 Копировать</button>
          </div>
          <div id="fixedText"></div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat">Слов: <b id="words">0</b></div>
        <div class="stat">Символов: <b id="chars">0</b></div>
        <div class="stat">Предложений: <b id="sentences">0</b></div>
        <div class="stat">Ошибок: <b id="errors">0</b></div>
        <div class="stat">Словарь: <b id="dictionaryStatus">загрузка...</b></div>
      </div>

      <div id="status" class="status">Загружаем словарь...</div>
    </section>

    <section class="card">
      <div class="results-head">
        <h2>Результаты</h2>
        <div id="badge" class="badge">0</div>
      </div>
      <div id="results">
        <div class="empty">Введите текст и нажмите «Проверить».</div>
      </div>
    </section>

  </div>

  <div id="copyToast" class="copy-toast">✅ Текст скопирован!</div>

  <script>
    // ============================================================
    // НАСТРОЙКИ
    // ============================================================

    const DICTIONARY_FILE = "https://raw.githubusercontent.com/danakt/russian-words/master/russian.txt";

    const editor = document.getElementById("editor");
    const fixedTextEl = document.getElementById("fixedText");
    const results = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const highlightOverlay = document.getElementById("highlightOverlay");
    const copyToast = document.getElementById("copyToast");

    const wordsEl = document.getElementById("words");
    const charsEl = document.getElementById("chars");
    const sentencesEl = document.getElementById("sentences");
    const errorsEl = document.getElementById("errors");
    const badgeEl = document.getElementById("badge");
    const dictionaryStatus = document.getElementById("dictionaryStatus");

    // ============================================================
    // ТЁМНАЯ ТЕМА
    // ============================================================

    let isDarkMode = localStorage.getItem('trenerchek-theme') === 'dark';

    function toggleTheme() {
      isDarkMode = !isDarkMode;
      document.body.classList.toggle('dark-mode', isDarkMode);
      document.querySelector('.theme-toggle').textContent = isDarkMode ? '☀️' : '🌙';
      localStorage.setItem('trenerchek-theme', isDarkMode ? 'dark' : 'light');
    }
    if (isDarkMode) {
      document.body.classList.add('dark-mode');
      document.querySelector('.theme-toggle').textContent = '☀️';
    }

    // ============================================================
    // ВСТАВКА ИЗ БУФЕРА / КОПИРОВАНИЕ
    // ============================================================

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        editor.value = text;
        checkText();
        showToast('📋 Текст вставлен из буфера обмена');
      } catch (err) {
        showToast('⚠️ Не удалось вставить текст. Разрешите доступ к буферу обмена.');
      }
    }

    function copyText() {
      const text = fixedTextEl.textContent;
      if (!text || !text.trim()) {
        showToast('⚠️ Нет текста для копирования');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        showToast('✅ Исправленный текст скопирован!');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✅ Исправленный текст скопирован!');
      });
    }

    function showToast(msg) {
      copyToast.textContent = msg;
      copyToast.classList.add('show');
      clearTimeout(copyToast._timeout);
      copyToast._timeout = setTimeout(() => copyToast.classList.remove('show'), 2500);
    }

    // ============================================================
    // СЛОВАРЬ
    // ============================================================

    let dictionary = new Set();
    let dictionaryLoaded = false;

    const fallbackWords = `
    я ты он она оно мы вы они и а но или да нет
    это тот эта это эти как что где когда почему
    кто какой которая который которые быть есть
    был была были будет делать сделать сделал
    сказать говорить идти пойти ходить знать
    понимать думать хотеть мочь должен можно
    нельзя нужно человек люди время день год
    сегодня завтра вчера текст слово предложение
    русский язык программа компьютер сайт работа
    помощь привет спасибо пожалуйста хороший
    хорошо проверка ошибка
    `.trim().split(/\s+/);

    async function loadDictionary() {
      dictionaryStatus.textContent = "загрузка...";
      try {
        const resp = await fetch(DICTIONARY_FILE, { cache: "no-store" });
        if (!resp.ok) throw new Error("Словарь не найден");
        const data = await resp.text();
        const lines = data.split(/\r?\n/);
        let count = 0;
        for (const line of lines) {
          const l = line.trim().toLowerCase();
          if (!l) continue;
          const parts = l.split(/\t/);
          let word = parts[0] || l;
          word = word.trim();
          if (/^[а-яё-]+$/i.test(word) && word.length >= 1) {
            dictionary.add(word);
            count++;
          }
        }
        if (count < 100) throw new Error("Слишком мало слов: " + count);
        fallbackWords.forEach(w => dictionary.add(w.toLowerCase()));
        dictionaryLoaded = true;
        dictionaryStatus.textContent = count.toLocaleString("ru-RU");
        statusEl.textContent = "✅ Словарь загружен (" + count.toLocaleString() + " слов)";
        statusEl.className = "status ok";
      } catch (e) {
        fallbackWords.forEach(w => dictionary.add(w.toLowerCase()));
        dictionaryLoaded = false;
        dictionaryStatus.textContent = "резервный (" + dictionary.size + ")";
        statusEl.textContent = "⚠️ Словарь не загружен. Используется встроенный (" + dictionary.size + " слов).";
        statusEl.className = "status warning";
      }
    }

    // ============================================================
    // СТАТИСТИКА
    // ============================================================

    function getTextStats(text) {
      const words = text.match(/[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g) || [];
      const wordCount = words.length;
      const charCount = text.length;
      const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
      const sentenceCount = sentences.length || (text.trim() ? 1 : 0);
      return { wordCount, charCount, sentenceCount };
    }

    // ============================================================
    // ОПЕЧАТКИ (ПО СЛОВАРЮ)
    // ============================================================

    function getSpellingIssues(text) {
      const issues = [];
      if (!dictionaryLoaded || dictionary.size === 0) return issues;

      const words = text.match(/[А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*/g) || [];
      let pos = 0;
      const positions = [];
      for (const w of words) {
        const idx = text.indexOf(w, pos);
        positions.push({ word: w, index: idx });
        pos = idx + w.length;
      }

      for (const item of positions) {
        const word = item.word;
        const lower = word.toLowerCase();
        if (lower.length < 3) continue;
        if (dictionary.has(lower)) continue;

        const suggestion = findSuggestion(lower);
        if (suggestion) {
          issues.push({
            type: "Опечатка",
            oldText: word,
            newText: preserveCase(word, suggestion),
            position: item.index,
            suggestion: `💡 ${preserveCase(word, suggestion)}`,
            suggestions: [preserveCase(word, suggestion)],
            fixType: 'spelling'
          });
        }
      }
      return issues;
    }

    function findSuggestion(word) {
      let best = null;
      let bestDist = Infinity;
      for (const cand of dictionary) {
        if (Math.abs(cand.length - word.length) > 2) continue;
        if (cand[0] !== word[0] && cand[0] !== word[0].toLowerCase()) continue;
        const d = levenshtein(word, cand);
        if (d < bestDist) { bestDist = d;
          best = cand; }
      }
      let threshold = 1;
      if (word.length >= 7) threshold = 2;
      if (word.length >= 11) threshold = 3;
      return bestDist <= threshold ? best : null;
    }

    function levenshtein(a, b) {
      if (a === b) return 0;
      if (a.length === 0) return b.length;
      if (b.length === 0) return a.length;
      let prev = new Array(b.length + 1);
      let cur = new Array(b.length + 1);
      for (let j = 0; j <= b.length; j++) prev[j] = j;
      for (let i = 1; i <= a.length; i++) {
        cur[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
        }
        [prev, cur] = [cur, prev];
      }
      return prev[b.length];
    }

    function preserveCase(orig, repl) {
      if (orig.length && orig[0] === orig[0].toUpperCase()) {
        return repl[0].toUpperCase() + repl.slice(1);
      }
      return repl;
    }

    // ============================================================
    // ЛИШНИЕ ПРОБЕЛЫ
    // ============================================================

    function getSpaceIssues(text) {
      const issues = [];
      let match;

      const spaces = / {2,}/g;
      while ((match = spaces.exec(text)) !== null) {
        issues.push({
          type: "Лишние пробелы",
          oldText: match[0],
          newText: " ",
          position: match.index,
          suggestion: "💡 уберите лишние пробелы",
          suggestions: [" "],
          fixType: 'space'
        });
      }

      const punct = / +([,.!?;:])/g;
      while ((match = punct.exec(text)) !== null) {
        issues.push({
          type: "Пробел перед знаком",
          oldText: match[0],
          newText: match[1],
          position: match.index,
          suggestion: `💡 уберите пробел перед "${match[1]}"`,
          suggestions: [match[1]],
          fixType: 'punctuation'
        });
      }

      return issues;
    }

    // ============================================================
    // ПОВТОРЫ СЛОВ
    // ============================================================

    function getRepeatIssues(text) {
      const issues = [];
      const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
      const allWords = text.match(/[А-Яа-яЁё]+/g) || [];

      let globalPos = 0;
      for (const sent of sentences) {
        const words = sent.match(/[А-Яа-яЁё]+/g) || [];
        const freq = {};
        for (const w of words) {
          const lower = w.toLowerCase();
          freq[lower] = (freq[lower] || 0) + 1;
        }
        for (const w of words) {
          const lower = w.toLowerCase();
          if (freq[lower] >= 2) {
            const posIdx = text.indexOf(w, globalPos);
            if (posIdx !== -1) {
              const alreadyAdded = issues.some(i =>
                i.position === posIdx && i.oldText === w
              );
              if (!alreadyAdded) {
                issues.push({
                  type: "Повтор слова в предложении",
                  oldText: w,
                  newText: w,
                  position: posIdx,
                  suggestion: "💡 повторяется в одном предложении",
                  suggestions: [],
                  fixType: 'repeat'
                });
              }
            }
          }
        }
        globalPos += sent.length;
      }

      const freqAll = {};
      for (const w of allWords) {
        const lower = w.toLowerCase();
        freqAll[lower] = (freqAll[lower] || 0) + 1;
      }
      for (const w of allWords) {
        const lower = w.toLowerCase();
        if (freqAll[lower] > 3) {
          const posIdx = text.indexOf(w);
          if (posIdx !== -1) {
            const alreadyAdded = issues.some(i =>
              i.position === posIdx && i.oldText === w
            );
            if (!alreadyAdded) {
              issues.push({
                type: "Частый повтор слова",
                oldText: w,
                newText: w,
                position: posIdx,
                suggestion: `💡 встречается ${freqAll[lower]} раз`,
                suggestions: [],
                fixType: 'repeat'
              });
            }
          }
        }
      }

      return issues;
    }

    // ============================================================
    // ОСНОВНАЯ ПРОВЕРКА
    // ============================================================

    let currentIssues = [];
    let skippedIssues = [];
    let isChecking = false;

    function getCurrentIssuesList() {
      return currentIssues.filter(issue =>
        !skippedIssues.some(s =>
          s.position === issue.position && s.oldText === issue.oldText
        )
      );
    }

    function getFixedText(text) {
      let fixed = text;
      const list = getCurrentIssuesList();
      const fixes = [];
      for (const issue of list) {
        if (issue.suggestions && issue.suggestions.length > 0 && issue.fixType !== 'repeat') {
          fixes.push({ position: issue.position, oldText: issue.oldText, newText: issue.newText });
        }
      }
      fixes.sort((a, b) => b.position - a.position);
      for (const f of fixes) {
        if (f.position + f.oldText.length <= fixed.length) {
          fixed = fixed.slice(0, f.position) + f.newText + fixed.slice(f.position + f.oldText.length);
        }
      }
      return fixed;
    }

    async function checkText() {
      const text = editor.value;
      if (!text.trim()) {
        currentIssues = [];
        skippedIssues = [];
        fixedTextEl.textContent = '';
        renderResults();
        updateStats();
        updateHighlighting(text);
        return;
      }
      if (isChecking) return;
      isChecking = true;
      statusEl.textContent = "⏳ Проверка...";
      statusEl.className = "status warning";
      document.querySelector('.primary').disabled = true;

      try {
        if (!dictionaryLoaded) {
          await loadDictionary();
        }

        const spelling = getSpellingIssues(text);
        const spaces = getSpaceIssues(text);
        const repeats = getRepeatIssues(text);

        let all = [...spelling, ...spaces, ...repeats];
        all.sort((a, b) => a.position - b.position);
        all = all.filter((item, idx, arr) =>
          idx === arr.findIndex(x => x.position === item.position && x.oldText === item.oldText)
        );

        skippedIssues = [];
        currentIssues = all;

        const fixed = getFixedText(text);
        fixedTextEl.textContent = fixed;

        renderResults();
        updateStats();
        updateHighlighting(text);

        const total = getCurrentIssuesList().length;
        statusEl.textContent = "✅ Проверка завершена. Найдено " + total + " ошибок.";
        statusEl.className = total > 0 ? "status error" : "status ok";
      } catch (e) {
        statusEl.textContent = "⚠️ Ошибка проверки. Попробуйте ещё раз.";
        statusEl.className = "status warning";
      } finally {
        isChecking = false;
        document.querySelector('.primary').disabled = false;
      }
    }

    // ============================================================
    // ПОДСВЕТКА
    // ============================================================

    function updateHighlighting(text) {
      if (!text.trim()) {
        highlightOverlay.innerHTML = '';
        return;
      }

      const list = getCurrentIssuesList();
      if (!list.length) {
        highlightOverlay.innerHTML = escapeHTML(text);
        return;
      }

      let html = '';
      let lastIndex = 0;
      const sorted = [...list].sort((a, b) => a.position - b.position);

      for (const err of sorted) {
        if (err.position > lastIndex) {
          html += escapeHTML(text.substring(lastIndex, err.position));
        }

        let cls = 'highlight-error';
        let typeLabel = 'Опечатка';
        let tooltipContent =
          `<span class="tip-type">Опечатка</span>${err.oldText}`;

        if (err.fixType === 'repeat') {
          cls = 'highlight-repeat';
          typeLabel = 'Повтор';
          tooltipContent =
            `<span class="tip-type">Повтор</span>${err.oldText}<span class="tip-suggestion">${err.suggestion}</span>`;
        } else if (err.fixType === 'space' || err.fixType === 'punctuation') {
          cls = 'highlight-error';
          typeLabel = 'Пробел';
          tooltipContent =
            `<span class="tip-type">Пробел</span>${err.oldText}<span class="tip-suggestion">${err.suggestion}</span>`;
        } else if (err.fixType === 'spelling') {
          cls = 'highlight-error';
          typeLabel = 'Опечатка';
          tooltipContent =
            `<span class="tip-type">Опечатка</span>${err.oldText}<span class="tip-suggestion">${err.suggestion}</span>`;
        }

        const end = Math.min(err.position + err.oldText.length, text.length);
        const wordText = text.substring(err.position, end);
        html +=
          `<span class="${cls} tooltip-trigger">${escapeHTML(wordText)}<span class="tooltip-text">${tooltipContent}</span></span>`;

        lastIndex = end;
      }

      if (lastIndex < text.length) {
        html += escapeHTML(text.substring(lastIndex));
      }

      highlightOverlay.innerHTML = html;
    }

    // ============================================================
    // СТАТИСТИКА
    // ============================================================

    function updateStats() {
      const text = editor.value;
      const stats = getTextStats(text);
      wordsEl.textContent = stats.wordCount;
      charsEl.textContent = stats.charCount;
      sentencesEl.textContent = stats.sentenceCount;
      const total = getCurrentIssuesList().length;
      errorsEl.textContent = total;
      badgeEl.textContent = total;
      badgeEl.className = total === 0 ? "badge zero" : "badge";
    }

    // ============================================================
    // ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ
    // ============================================================

    function renderResults() {
      const list = getCurrentIssuesList();
      if (!list.length) {
        results.innerHTML =
          `<div class="empty"><div class="success">✓ Ошибок не найдено</div></div>`;
        return;
      }
      results.innerHTML = '';
      list.forEach((issue, idx) => {
        const item = document.createElement('div');
        item.className = 'issue';
        const hasFix = issue.suggestions && issue.suggestions.length > 0 && issue.fixType !== 'repeat';
        item.innerHTML = `
          <div class="issue-title">${escapeHTML(issue.type)} <span class="tag">#${idx+1}</span></div>
          <div class="issue-text"><span class="wrong">${escapeHTML(showSpaces(issue.oldText))}</span> ${hasFix ? `→ <span class="correct">${escapeHTML(showSpaces(issue.newText))}</span>` : ''}</div>
          <div class="issue-actions">
            ${hasFix ? `<button class="fix" onclick="applyIssue(${idx})">✅ Исправить</button>` : ''}
            <button class="skip" onclick="skipIssue(${idx})">⏭️ Пропустить</button>
          </div>
        `;
        results.appendChild(item);
      });
    }

    function applyIssue(index) {
      const list = getCurrentIssuesList();
      const issue = list[index];
      if (!issue || !issue.suggestions || !issue.suggestions.length) return;
      const text = editor.value;
      editor.value = text.slice(0, issue.position) + issue.newText + text.slice(issue.position + issue.oldText.length);
      const idx = currentIssues.findIndex(i => i.position === issue.position && i.oldText === issue.oldText);
      if (idx !== -1) currentIssues.splice(idx, 1);
      checkText();
    }

    function skipIssue(index) {
      const list = getCurrentIssuesList();
      if (index >= 0 && index < list.length) {
        skippedIssues.push(list[index]);
        renderResults();
        updateStats();
        updateHighlighting(editor.value);
        showToast('⏭️ Ошибка пропущена');
      }
    }

    function fixAll() {
      checkText();
      const list = getCurrentIssuesList();
      const fixable = list.filter(i => i.suggestions && i.suggestions.length > 0 && i.fixType !== 'repeat');
      if (!fixable.length) return;
      const sorted = [...fixable].sort((a, b) => b.position - a.position);
      let text = editor.value;
      for (const issue of sorted) {
        if (issue.position + issue.oldText.length <= text.length) {
          const cur = text.substring(issue.position, issue.position + issue.oldText.length);
          if (cur === issue.oldText) {
            text = text.slice(0, issue.position) + issue.newText + text.slice(issue.position + issue.oldText.length);
          }
        }
      }
      if (text !== editor.value) {
        editor.value = text;
        currentIssues = [];
        skippedIssues = [];
        checkText();
      }
    }

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ
    // ============================================================

    function showSpaces(v) { return v.replace(/ /g, "␠").replace(/\t/g, "⇥"); }

    function escapeHTML(v) {
      return v.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g,
        "&#039;");
    }

    function clearText() {
      editor.value = "";
      fixedTextEl.textContent = "";
      currentIssues = [];
      skippedIssues = [];
      results.innerHTML = `<div class="empty">Введите текст и нажмите «Проверить».</div>`;
      updateStats();
      updateHighlighting('');
      statusEl.textContent = "Готово к проверке.";
      statusEl.className = "status";
    }

    function demo() {
      editor.value =
        `Привет! Проверь мой текст.\n\nОн пошла в магазин. Она пошёл домой. Он купил хлеб. Он очень доволен.\n\nСпасибо!`;
      checkText();
    }

    // ============================================================
    // АВТОПРОВЕРКА
    // ============================================================

    let autoTimeout;
    editor.addEventListener('input', function() {
      clearTimeout(autoTimeout);
      autoTimeout = setTimeout(() => {
        if (this.value.trim().length > 10) checkText();
        else { updateStats();
          updateHighlighting(this.value); }
      }, 1500);
    });

    editor.addEventListener('scroll', function() {
      highlightOverlay.scrollTop = this.scrollTop;
      highlightOverlay.scrollLeft = this.scrollLeft;
    });

    // ============================================================
    // ЗАПУСК
    // ============================================================

    updateStats();
    loadDictionary();
  </script>

</body>
</html>
